// ======================================
// DETERMINISTIC RANDOMNESS
// ======================================

function hash(x,z){

    const value =
        Math.sin(
            x*127.1 +
            z*311.7
        )*43758.5453123;

    return value -
        Math.floor(value);
}


function smooth(t){

    return t*t*(3-2*t);
}


function noise(x,z){

    const x0 =
        Math.floor(x);

    const z0 =
        Math.floor(z);

    const x1 =
        x0+1;

    const z1 =
        z0+1;


    const sx =
        smooth(x-x0);

    const sz =
        smooth(z-z0);


    const n00 =
        hash(x0,z0);

    const n10 =
        hash(x1,z0);

    const n01 =
        hash(x0,z1);

    const n11 =
        hash(x1,z1);


    const ix0 =
        THREE.MathUtils.lerp(
            n00,
            n10,
            sx
        );

    const ix1 =
        THREE.MathUtils.lerp(
            n01,
            n11,
            sx
        );


    return THREE.MathUtils.lerp(
        ix0,
        ix1,
        sz
    );
}


function fbm(x,z){

    let value = 0;

    let amplitude = 0.5;

    let frequency = 1;


    for(
        let i=0;
        i<6;
        i++
    ){

        value +=
            noise(
                x*frequency,
                z*frequency
            ) *
            amplitude;


        frequency *= 2;

        amplitude *= 0.5;
    }


    return value;
}


// ======================================
// TERRAIN HEIGHT
// ======================================

const terrainCache =
    new Map();


function rawHeight(x,z){

    const continental =
        fbm(
            x*0.0018,
            z*0.0018
        );

    const hills =
        fbm(
            x*0.006,
            z*0.006
        );

    const mountains =
        fbm(
            x*0.018,
            z*0.018
        );


    let height =

        continental * 14 +

        hills * 12 +

        mountains * 5;


    height -= 10;


    return height;
}


function terrainHeight(x,z){

    const cx =
        Math.round(x*2)/2;

    const cz =
        Math.round(z*2)/2;


    const key =
        cx+","+cz;


    if(
        terrainCache.has(key)
    ){

        return terrainCache.get(key);
    }


    const h =
        rawHeight(
            cx,
            cz
        );


    terrainCache.set(
        key,
        h
    );


    if(
        terrainCache.size >
        50000
    ){

        const first =
            terrainCache.keys()
            .next()
            .value;

        terrainCache.delete(
            first
        );
    }


    return h;
}


// ======================================
// TERRAIN SLOPE
// ======================================

function terrainSlope(x,z){

    const e = 0.5;


    const left =
        terrainHeight(
            x-e,
            z
        );

    const right =
        terrainHeight(
            x+e,
            z
        );

    const down =
        terrainHeight(
            x,
            z-e
        );

    const up =
        terrainHeight(
            x,
            z+e
        );


    const dx =
        (right-left) /
        (2*e);

    const dz =
        (up-down) /
        (2*e);


    return Math.sqrt(
        dx*dx +
        dz*dz
    );
}


// ======================================
// TERRAIN NORMAL
// ======================================

function terrainNormal(x,z){

    const e = 0.5;


    const left =
        terrainHeight(
            x-e,
            z
        );

    const right =
        terrainHeight(
            x+e,
            z
        );

    const down =
        terrainHeight(
            x,
            z-e
        );

    const up =
        terrainHeight(
            x,
            z+e
        );


    const normal =
        new THREE.Vector3(
            left-right,
            2*e,
            down-up
        );


    return normal.normalize();
}


// ======================================
// BIOME NOISE
// ======================================

function moisture(x,z){

    return fbm(
        x*0.004+1000,
        z*0.004-2000
    );
}


function temperature(x,z){

    return fbm(
        x*0.003-5000,
        z*0.003+4000
    );
}


function getBiome(x,z){

    const h =
        terrainHeight(
            x,
            z
        );


    const m =
        moisture(
            x,
            z
        );


    const t =
        temperature(
            x,
            z
        );


    if(h < -1){
        return "water";
    }


    if(h < 3){

        if(t < 0.25){
            return "sand";
        }

        return "plains";
    }


    if(h < 8){

        if(
            t > 0.65 &&
            m < 0.45
        ){

            return "desert";
        }


        if(m > 0.58){
            return "forest";
        }


        return "plains";
    }


    if(h < 16){

        if(
            m > 0.62
        ){

            return "forest";
        }


        if(
            t > 0.7 &&
            m < 0.4
        ){

            return "dryland";
        }


        return "grassland";
    }


    if(h < 25){

        return "rock";
    }


    return "mountain";
}

// ======================================
// ALIGN OBJECT TO TERRAIN
// ======================================

const upVector =
    new THREE.Vector3(
        0,
        1,
        0
    );


function alignToTerrain(
    object,
    x,
    z
){

    const normal =
        terrainNormal(
            x,
            z
        );


    object.quaternion.setFromUnitVectors(
        upVector,
        normal
    );
}


// ======================================
// OBJECT CREATION
// ======================================

function createTree(
    x,
    z,
    scale
){

    const ground =
        terrainHeight(
            x,
            z
        );


    const slope =
        terrainSlope(
            x,
            z
        );


    if(slope > 2.2){
        return;
    }


    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            trunkGeometry,
            trunkMaterial
        );


    trunk.scale.setScalar(
        scale
    );


    trunk.position.y =
        2 * scale;


    trunk.castShadow =
        true;


    const leaves =
        new THREE.Mesh(
            leavesGeometry,
            leavesMaterial
        );


    leaves.scale.setScalar(
        scale
    );


    leaves.position.y =
        6 * scale;


    leaves.castShadow =
        true;


    tree.add(
        trunk
    );

    tree.add(
        leaves
    );


    tree.position.set(
        x,
        ground,
        z
    );


    alignToTerrain(
        tree,
        x,
        z
    );


    scene.add(
        tree
    );
}


function createBush(
    x,
    z,
    scale
){

    const ground =
        terrainHeight(
            x,
            z
        );


    const bush =
        new THREE.Mesh(
            bushGeometry,
            bushMaterial
        );


    bush.position.set(
        x,
        ground +
        0.8*scale,
        z
    );


    bush.scale.set(
        scale*1.2,
        scale*0.7,
        scale*1.2
    );


    bush.castShadow =
        true;


    alignToTerrain(
        bush,
        x,
        z
    );


    scene.add(
        bush
    );
}


function createRock(
    x,
    z,
    scale
){

    const ground =
        terrainHeight(
            x,
            z
        );


    const rock =
        new THREE.Mesh(
            rockGeometry,
            rockMaterial
        );


    rock.position.set(
        x,
        ground +
        scale*0.45,
        z
    );


    rock.scale.set(
        scale*1.2,
        scale*0.8,
        scale
    );


    rock.rotation.y =
        hash(
            x,
            z
        )*Math.PI*2;


    rock.castShadow =
        true;


    rock.receiveShadow =
        true;


    alignToTerrain(
        rock,
        x,
        z
    );


    scene.add(
        rock
    );
}


function createGrass(
    x,
    z,
    scale
){

    const ground =
        terrainHeight(
            x,
            z
        );


    const grass =
        new THREE.Mesh(
            grassGeometry,
            grassMaterial
        );


    grass.position.set(
        x,
        ground +
        0.55*scale,
        z
    );


    grass.scale.setScalar(
        scale
    );


    grass.rotation.y =
        hash(
            x*4,
            z*3
        ) *
        Math.PI;


    alignToTerrain(
        grass,
        x,
        z
    );


    scene.add(
        grass
    );
}


function createFlower(
    x,
    z,
    scale
){

    const ground =
        terrainHeight(
            x,
            z
        );


    const flower =
        new THREE.Mesh(
            flowerGeometry,
            flowerMaterials[
                Math.floor(
                    hash(x,z) *
                    flowerMaterials.length
                )
            ]
        );


    flower.position.set(
        x,
        ground +
        0.9*scale,
        z
    );


    flower.scale.setScalar(
        scale
    );


    flower.castShadow =
        false;


    alignToTerrain(
        flower,
        x,
        z
    );


    scene.add(
        flower
    );
}


// ======================================
// CHUNK VEGETATION
// ======================================

function createChunkObjects(
    cx,
    cz
){

    const baseX =
        cx*CHUNK_SIZE -
        CHUNK_SIZE/2;

    const baseZ =
        cz*CHUNK_SIZE -
        CHUNK_SIZE/2;


    for(
        let i=0;
        i<70;
        i++
    ){

        const x =
            baseX +
            hash(
                cx*1000+i,
                cz*2000+i
            ) *
            CHUNK_SIZE;


        const z =
            baseZ +
            hash(
                cx*3000+i,
                cz*4000+i
            ) *
            CHUNK_SIZE;


        const h =
            terrainHeight(
                x,
                z
            );


        const slope =
            terrainSlope(
                x,
                z
            );


        const biome =
            getBiome(
                x,
                z
            );


        if(
            biome === "water" ||
            slope > 2.5
        ){

            continue;
        }


        const r =
            hash(
                i*17+cx,
                i*31+cz
            );


        // Forest trees

        if(
            biome === "forest"
        ){

            if(r < 0.55){

                createTree(
                    x,
                    z,
                    0.65 +
                    r
                );

            }else if(
                r < 0.75
            ){

                createBush(
                    x,
                    z,
                    0.7 +
                    r
                );

            }else{

                createGrass(
                    x,
                    z,
                    0.7 +
                    r
                );
            }


            if(
                r > 0.45
            ){

                createFlower(
                    x+0.7,
                    z+0.5,
                    0.7
                );
            }


            continue;
        }


        // Plains

        if(
            biome === "plains" ||
            biome === "grassland"
        ){

            if(r < 0.12){

                createTree(
                    x,
                    z,
                    0.65 +
                    r
                );

            }else if(
                r < 0.22
            ){

                createBush(
                    x,
                    z,
                    0.5 +
                    r
                );

            }else if(
                r < 0.82
            ){

                createGrass(
                    x,
                    z,
                    0.55 +
                    r
                );

            }else{

                createFlower(
                    x,
                    z,
                    0.6 +
                    r
                );
            }


            continue;
        }


        // Drylands

        if(
            biome === "dryland"
        ){

            if(r < 0.12){

                createBush(
                    x,
                    z,
                    0.45
                );

            }else{

                createGrass(
                    x,
                    z,
                    0.45
                );
            }


            continue;
        }


        // Desert

        if(
            biome === "desert"
        ){

            if(r < 0.08){

                createRock(
                    x,
                    z,
                    0.7 +
                    r
                );
            }


            continue;
        }


        // Mountains

        if(
            biome === "rock" ||
            biome === "mountain"
        ){

            if(r < 0.5){

                createRock(
                    x,
                    z,
                    0.6 +
                    r*1.5
                );
            }
        }
    }
}


// ======================================
// CHUNK GENERATION
// ======================================

const chunkMap =
    new Map();


function chunkKey(cx,cz){

    return cx+","+cz;
}


function createChunk(
    cx,
    cz
){

    const key =
        chunkKey(
            cx,
            cz
        );


    if(
        chunkMap.has(key)
    ){
        return;
    }


    const geometry =
        new THREE.PlaneGeometry(
            CHUNK_SIZE,
            CHUNK_SIZE,
            TERRAIN_SEGMENTS,
            TERRAIN_SEGMENTS
        );


    geometry.rotateX(
        -Math.PI/2
    );


    const positions =
        geometry.attributes
        .position;


    for(
        let i=0;
        i<positions.count;
        i++
    ){

        const lx =
            positions.getX(i);

        const lz =
            positions.getZ(i);


        const wx =
            cx*CHUNK_SIZE +
            lx;

        const wz =
            cz*CHUNK_SIZE +
            lz;


        positions.setY(
            i,
            terrainHeight(
                wx,
                wz
            )
        );
    }


    positions.needsUpdate =
        true;


    geometry.computeVertexNormals();


    const centerX =
        cx*CHUNK_SIZE;

    const centerZ =
        cz*CHUNK_SIZE;


    const biome =
        getBiome(
            centerX,
            centerZ
        );


    const mesh =
        new THREE.Mesh(
            geometry,
            materials[
                biome
            ] ||
            materials.plains
        );


    mesh.position.set(
        centerX,
        0,
        centerZ
    );


    mesh.receiveShadow =
        true;


    scene.add(
        mesh
    );


    chunkMap.set(
        key,
        {
            mesh,
            cx,
            cz
        }
    );


    createChunkObjects(
        cx,
        cz
    );
}

    );

const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );


let joystickActive =
    false;

let joystickPointer =
    null;

let joystickX =
    0;

let joystickY =
    0;


function updateJoystick(
    clientX,
    clientY
){

    const rect =
        joystickElement
        .getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width/2;

    const centerY =
        rect.top +
        rect.height/2;


    let dx =
        clientX -
        centerX;

    let dy =
        clientY -
        centerY;


    const radius =
        48;


    const distance =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    if(
        distance > radius
    ){

        dx =
            dx /
            distance *
            radius;

        dy =
            dy /
            distance *
            radius;
    }


    joystickX =
        dx/radius;

    joystickY =
        dy/radius;


    joystickKnob.style.transform =
        "translate("+
        dx+
        "px,"+
        dy+
        "px)";
}


joystickElement.addEventListener(
    "pointerdown",
    e => {

        joystickActive =
            true;

        joystickPointer =
            e.pointerId;

        joystickElement
            .setPointerCapture(
                e.pointerId
            );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);


joystickElement.addEventListener(
    "pointermove",
    e => {

        if(
            !joystickActive ||
            e.pointerId !==
            joystickPointer
        ){
            return;
        }


        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);


function resetJoystick(){

    joystickActive =
        false;

    joystickPointer =
        null;

    joystickX =
        0;

    joystickY =
        0;


    joystickKnob.style.transform =
        "translate(0px,0px)";
}


joystickElement.addEventListener(
    "pointerup",
    resetJoystick
);

joystickElement.addEventListener(
    "pointercancel",
    resetJoystick
);


// ======================================
// JUMP BUTTON
// ======================================

const jumpButton =
    document.getElementById(
        "jump"
    );


jumpButton.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();


        if(
            player.grounded
        ){

            player.velocity.y =
                player.jumpPower;

            player.grounded =
                false;
        }
    }
);


// ======================================
// SPRINT BUTTON
// ======================================

const sprintButton =
    document.getElementById(
        "sprint"
    );


sprintButton.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        player.sprinting =
            true;
    }
);


sprintButton.addEventListener(
    "pointerup",
    () => {

        player.sprinting =
            false;
    }
);


sprintButton.addEventListener(
    "pointercancel",
    () => {

        player.sprinting =
            false;
    }
);


// ======================================
// CAMERA TOUCH LOOK
// ======================================

const touchLook = {

    active:false,

    pointer:null,

    x:0,

    y:0
};


renderer.domElement.addEventListener(
    "pointerdown",
    e => {

        if(
            e.pointerType !==
            "touch"
        ){
            return;
        }


        if(
            e.clientX <
            innerWidth*0.42
        ){
            return;
        }


        touchLook.active =
            true;

        touchLook.pointer =
            e.pointerId;

        touchLook.x =
            e.clientX;

        touchLook.y =
            e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    e => {

        if(
            !touchLook.active ||
            e.pointerId !==
            touchLook.pointer
        ){
            return;
        }


        const dx =
            e.clientX -
            touchLook.x;

        const dy =
            e.clientY -
            touchLook.y;


        player.yaw -=
            dx*0.003;


        player.pitch -=
            dy*0.003;


        player.pitch =
            THREE.MathUtils.clamp(
                player.pitch,
                -1.45,
                1.45
            );


        touchLook.x =
            e.clientX;

        touchLook.y =
            e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    e => {

        if(
            e.pointerId ===
            touchLook.pointer
        ){

            touchLook.active =
                false;
        }
    }
);


// ======================================
// DESKTOP MOUSE LOOK
// ======================================

let mouseLocked =
    false;


renderer.domElement.addEventListener(
    "click",
    () => {

        if(
            innerWidth >
            900
        ){

            renderer.domElement
                .requestPointerLock();
        }
    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        mouseLocked =
            document.pointerLockElement ===
            renderer.domElement;
    }
);


document.addEventListener(
    "mousemove",
    e => {

        if(
            !mouseLocked
        ){
            return;
        }


        player.yaw -=
            e.movementX*0.002;


        player.pitch -=
            e.movementY*0.002;


        player.pitch =
            THREE.MathUtils.clamp(
                player.pitch,
                -1.45,
                1.45
            );
    }
);


// ======================================
// MOVEMENT
// ======================================

const move =
    new THREE.Vector3();


const forward =
    new THREE.Vector3();


const right =
    new THREE.Vector3();


function updateMovement(dt){

    let forwardInput =
        0;

    let rightInput =
        0;


    if(keys["KeyW"]){
        forwardInput += 1;
    }

    if(keys["KeyS"]){
        forwardInput -= 1;
    }

    if(keys["KeyD"]){
        rightInput += 1;
    }

    if(keys["KeyA"]){
        rightInput -= 1;
    }


    if(joystickActive){

        forwardInput =
            -joystickY;

        rightInput =
            joystickX;
    }


    move.set(
        0,
        0,
        0
    );


    forward.set(
        -Math.sin(
            player.yaw
        ),
        0,
        -Math.cos(
            player.yaw
        )
    );


    right.set(
        Math.cos(
            player.yaw
        ),
        0,
        -Math.sin(
            player.yaw
        )
    );


    move.addScaledVector(
        forward,
        forwardInput
    );


    move.addScaledVector(
        right,
        rightInput
    );


    if(
        move.lengthSq() > 1
    ){

        move.normalize();
    }


    const speed =
        player.sprinting
        ?
        player.sprintSpeed
        :
        player.walkingSpeed;


    const acceleration =
        player.grounded
        ?
        70
        :
        25;


    player.velocity.x =
        THREE.MathUtils.damp(
            player.velocity.x,
            move.x*speed,
            acceleration,
            dt
        );


    player.velocity.z =
        THREE.MathUtils.damp(
            player.velocity.z,
            move.z*speed,
            acceleration,
            dt
        );
}


// ======================================
// PHYSICS
// ======================================

function updatePhysics(dt){

    updateMovement(dt);


    player.velocity.y +=
        player.gravity*dt;


    player.position.x +=
        player.velocity.x*dt;


    player.position.z +=
        player.velocity.z*dt;


    player.position.y +=
        player.velocity.y*dt;


    const ground =
        terrainHeight(
            player.position.x,
            player.position.z
        );


    const desiredY =
        ground +
        player.height;


    if(
        player.position.y <=
        desiredY
    ){

        player.position.y =
            desiredY;


        if(
            player.velocity.y < 0
        ){

            player.velocity.y =
                0;
        }


        player.grounded =
            true;

    }else{

        player.grounded =
            false;
    }
}


// ======================================
// CAMERA
// ======================================

function updateCamera(){

    camera.position.copy(
        player.position
    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        player.yaw;


    camera.rotation.x =
        player.pitch;
}


// ======================================
// DAY/NIGHT
// ======================================

let worldTime =
    8;


const DAY_LENGTH =
    180;


function updateDayNight(dt){

    worldTime +=
        dt*24/DAY_LENGTH;


    if(
        worldTime >= 24
    ){

        worldTime -=
            24;
    }


    const angle =
        worldTime/24 *
        Math.PI*2;


    const radius =
        800;


    const sunX =
        Math.cos(angle)*
        radius;


    const sunY =
        Math.sin(angle)*
        radius;


    const sunZ =
        300;


    sun.position.set(
        sunX,
        sunY,
        sunZ
    );


    sunVisual.position.copy(
        sun.position
    );


    const daylight =
        Math.max(
            0,
            Math.sin(angle)
        );


    sun.intensity =
        0.08 +
        daylight*2.2;


    ambient.intensity =
        0.18 +
        daylight*0.85;


    const dayColor =
        new THREE.Color(
            0x76a9d6
        );


    const nightColor =
        new THREE.Color(
            0x071329
        );


    const skyColor =
        nightColor.clone().lerp(
            dayColor,
            Math.pow(
                daylight,
                0.45
            )
        );


    skyMaterial.color.copy(
        skyColor
    );


    scene.fog.color.copy(
        skyColor
    );


    ambient.color.copy(
        skyColor
    );


    sun.color.setHSL(
        0.11,
        0.8,
        0.65 +
        daylight*0.35
    );
}


// ======================================
// WORLD STREAMING
// ======================================

function updateWorld(){

    const cx =
        Math.floor(
            player.position.x /
            CHUNK_SIZE
        );


    const cz =
        Math.floor(
            player.position.z /
            CHUNK_SIZE
        );


    for(
        let x=-VIEW_DISTANCE;
        x<=VIEW_DISTANCE;
        x++
    ){

        for(
            let z=-VIEW_DISTANCE;
            z<=VIEW_DISTANCE;
            z++
        ){

            createChunk(
                cx+x,
                cz+z
            );
        }
    }
}


// ======================================
// START WORLD
// ======================================

createChunk(
    0,
    0
);


updateWorld();


// ======================================
// LOOP
// ======================================

let previous =
    performance.now();


let accumulator =
    0;


const FIXED_STEP =
    1/120;


let worldTimer =
    0;


function animate(now){

    requestAnimationFrame(
        animate
    );


    let dt =
        (now-previous)/1000;


    previous =
        now;


    dt =
        Math.min(
            dt,
            0.1
        );


    accumulator +=
        dt;


    while(
        accumulator >=
        FIXED_STEP
    ){

        updatePhysics(
            FIXED_STEP
        );


        accumulator -=
            FIXED_STEP;
    }


    updateCamera();


    worldTimer +=
        dt;


    if(
        worldTimer >
        0.25
    ){

        updateWorld();

        worldTimer =
            0;
    }


    updateDayNight(
        dt
    );


    sky.position.copy(
        camera.position
    );


    renderer.render(
        scene,
        camera
    );
}


requestAnimationFrame(
    animate
);


// ======================================
// RESIZE
// ======================================

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.5
            )
        );
    }
);

</script>
