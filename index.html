<script>

// Check Three.js

if(typeof THREE === "undefined"){

    const error =
        document.getElementById("error");

    error.style.display = "block";

    error.textContent =
        "Three.js failed to load.\n\n" +
        "Make sure your device has internet access " +
        "and try again.";

    throw new Error(
        "Three.js failed to load"
    );

}


// Engine configuration

const CONFIG = {

    seed:739182,

    chunkSize:64,

    terrainResolution:16,

    renderRadius:3,

    gravity:-24,

    walkSpeed:9,

    sprintSpeed:15,

    acceleration:38,

    jumpVelocity:10,

    playerHeight:1.8,

    cacheSize:50000,

    fixedStep:1/120

};


// Numerical cache

class HeightCache{

    constructor(limit){

        this.limit=limit;

        this.map=new Map();

    }

    key(x,z){

        return x+"|"+z;

    }

    get(x,z){

        return this.map.get(
            this.key(x,z)
        );

    }

    set(x,z,value){

        const key=
            this.key(x,z);

        this.map.set(
            key,
            value
        );

        if(
            this.map.size >
            this.limit
        ){

            const first=
                this.map.keys()
                .next()
                .value;

            this.map.delete(
                first
            );

        }

    }

    size(){

        return this.map.size;

    }

}


const heightCache=
    new HeightCache(
        CONFIG.cacheSize
    );


// Fast deterministic hash

function hash(x,z){

    const value=
        Math.sin(
            x*127.1+
            z*311.7+
            CONFIG.seed*.001
        )*
        43758.5453123;

    return value-
        Math.floor(value);

}


// Smooth interpolation

function smooth(t){

    return t*t*(3-2*t);

}


// Value noise

function noise(x,z){

    const x0=
        Math.floor(x);

    const z0=
        Math.floor(z);

    const x1=
        x0+1;

    const z1=
        z0+1;

    const sx=
        smooth(x-x0);

    const sz=
        smooth(z-z0);

    const n00=
        hash(x0,z0);

    const n10=
        hash(x1,z0);

    const n01=
        hash(x0,z1);

    const n11=
        hash(x1,z1);

    const a=
        n00+
        (n10-n00)*sx;

    const b=
        n01+
        (n11-n01)*sx;

    return(
        a+
        (b-a)*sz
    )*2-1;

}


// Fractal Brownian Motion

function fbm(x,z){

    let value=0;

    let amplitude=.5;

    let frequency=1;

    for(
        let i=0;
        i<6;
        i++
    ){

        value+=
            noise(
                x*frequency,
                z*frequency
            )*
            amplitude;

        frequency*=2;

        amplitude*=.5;

    }

    return value;

}


// Ridged multifractal

function ridged(x,z){

    let value=0;

    let amplitude=.5;

    let frequency=.012;

    for(
        let i=0;
        i<6;
        i++
    ){

        let n=
            noise(
                x*frequency,
                z*frequency
            );

        n=
            1-Math.abs(n);

        n*=n;

        value+=
            n*amplitude;

        frequency*=2.1;

        amplitude*=.5;

    }

    return value;

}


// Main mathematical terrain function

function rawHeight(x,z){

    const continental=
        fbm(
            x*.004,
            z*.004
        )*12;

    const hills=
        fbm(
            x*.018,
            z*.018
        )*5;

    const mountains=
        ridged(
            x,
            z
        )*28;

    const waves=
        Math.sin(x*.018)*
        Math.cos(z*.023)*
        1.5;

    const valley=
        -Math.abs(
            fbm(
                x*.009,
                z*.009
            )
        )*5;

    return(
        continental+
        hills+
        mountains+
        waves+
        valley
    );

}


// Cached terrain evaluation

function terrainHeight(x,z){

    const keyX=
        Math.round(x*2)/2;

    const keyZ=
        Math.round(z*2)/2;

    const cached=
        heightCache.get(
            keyX,
            keyZ
        );

    if(
        cached !== undefined
    ){

        return cached;

    }

    const result=
        rawHeight(
            keyX,
            keyZ
        );

    heightCache.set(
        keyX,
        keyZ,
        result
    );

    return result;

}


// Numerical gradient

function terrainGradient(x,z){

    const e=.5;

    const dx=
        (
            terrainHeight(
                x+e,
                z
            )-
            terrainHeight(
                x-e,
                z
            )
        )/
        (2*e);

    const dz=
        (
            terrainHeight(
                x,
                z+e
            )-
            terrainHeight(
                x,
                z-e
            )
        )/
        (2*e);

    return{
        x:dx,
        z:dz
    };

}


// Terrain slope

function terrainSlope(x,z){

    const gradient=
        terrainGradient(
            x,
            z
        );

    return Math.hypot(
        gradient.x,
        gradient.z
    );

}


// Surface normal

function terrainNormal(x,z){

    const gradient=
        terrainGradient(
            x,
            z
        );

    const normal=
        new THREE.Vector3(
            -gradient.x,
            1,
            -gradient.z
        );

    return normal.normalize();

}


// Biome classification

function getBiome(x,z){

    const height=
        terrainHeight(
            x,
            z
        );

    const slope=
        terrainSlope(
            x,
            z
        );

    if(height<1){

        return "OCEAN";

    }

    if(
        height<6 &&
        slope<.3
    ){

        return "PLAINS";

    }

    if(height<12){

        return "HILLS";

    }

    if(height<22){

        return "MOUNTAINS";

    }

    return "PEAK";

}


// Scene

const scene=
    new THREE.Scene();

scene.background=
    new THREE.Color(
        0x071019
    );

scene.fog=
    new THREE.FogExp2(
        0x071019,
        .006
    );


// Camera

const camera=
    new THREE.PerspectiveCamera(
        72,
        innerWidth/
        innerHeight,
        .05,
        1500
    );


// Renderer

const renderer=
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"

    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.5
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


// Lighting

const hemisphere=
    new THREE.HemisphereLight(
        0xaacfff,
        0x162015,
        1.4
    );

scene.add(
    hemisphere
);


const sun=
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.castShadow=true;

sun.shadow.mapSize.set(
    1024,
    1024
);

sun.shadow.camera.near=1;

sun.shadow.camera.far=500;

sun.shadow.camera.left=-150;

sun.shadow.camera.right=150;

sun.shadow.camera.top=150;

sun.shadow.camera.bottom=-150;

scene.add(
    sun
);


// Terrain materials

const materials={

    plains:
        new THREE.MeshStandardMaterial({
            color:0x4e7548,
            roughness:1
        }),

    hills:
        new THREE.MeshStandardMaterial({
            color:0x687b52,
            roughness:1
        }),

    mountains:
        new THREE.MeshStandardMaterial({
            color:0x686c6e,
            roughness:1
        }),

    peaks:
        new THREE.MeshStandardMaterial({
            color:0xd0d0d0,
            roughness:.9
        })

};


// Object materials

const treeMaterial=
    new THREE.MeshStandardMaterial({
        color:0x405631,
        roughness:1
    });


const rockMaterial=
    new THREE.MeshStandardMaterial({
        color:0x666a6c,
        roughness:1
    });


// Reusable geometries

const treeGeometry=
    new THREE.CylinderGeometry(
        .25,
        .45,
        1,
        6
    );


const rockGeometry=
    new THREE.IcosahedronGeometry(
        1,
        0
    );


// World containers

const chunks=
    new Map();

const objects=
    new THREE.Group();

scene.add(
    objects
);


// Chunk key

function chunkKey(cx,cz){

    return cx+","+cz;

}


// Select terrain material

function materialForHeight(h){

    if(h<1){

        return materials.plains;

    }

    if(h<8){

        return materials.plains;

    }

    if(h<14){

        return materials.hills;

    }

    if(h<23){

        return materials.mountains;

    }

    return materials.peaks;

}


// Create procedural objects

function createChunkObjects(cx,cz){

    const count=
        8+
        Math.floor(
            hash(
                cx+400,
                cz+900
            )*12
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        const rx=
            hash(
                cx*31+i,
                cz*17+i
            );

        const rz=
            hash(
                cx*47+i,
                cz*29+i
            );

        const x=
            cx*CONFIG.chunkSize+
            (rx-.5)*
            CONFIG.chunkSize;

        const z=
            cz*CONFIG.chunkSize+
            (rz-.5)*
            CONFIG.chunkSize;

        const h=
            terrainHeight(
                x,
                z
            );

        if(h<3){

            continue;

        }

        const type=
            hash(
                cx*73+i,
                cz*83+i
            );

        let object;

        if(type<.72){

            const height=
                2+
                hash(
                    i+100,
                    cx
                )*4;

            object=
                new THREE.Mesh(
                    treeGeometry,
                    treeMaterial
                );

            object.scale.set(
                1,
                height,
                1
            );

            object.position.set(
                x,
                h+
                height*.5,
                z
            );

        }
        else{

            const scale=
                .7+
                hash(
                    i+500,
                    cz
                )*1.4;

            object=
                new THREE.Mesh(
                    rockGeometry,
                    rockMaterial
                );

            object.scale.setScalar(
                scale
            );

            object.position.set(
                x,
                h+
                scale*.5,
                z
            );

        }

        object.castShadow=true;

        object.receiveShadow=true;

        object.userData.chunk=
            chunkKey(
                cx,
                cz
            );

        objects.add(
            object
        );

    }

}


// Create terrain chunk

function createChunk(cx,cz){

    const key=
        chunkKey(
            cx,
            cz
        );

    if(
        chunks.has(key)
    ){

        return;

    }

    const size=
        CONFIG.chunkSize;

    const resolution=
        CONFIG.terrainResolution;

    const geometry=
        new THREE.PlaneGeometry(
            size,
            size,
            resolution,
            resolution
        );

    const positions=
        geometry.attributes.position;

    let average=0;

    for(
        let i=0;
        i<positions.count;
        i++
    ){

        const localX=
            positions.getX(i);

        const localZ=
            positions.getY(i);

        const worldX=
            cx*size+
            localX;

        const worldZ=
            cz*size+
            localZ;

        const height=
            terrainHeight(
                worldX,
                worldZ
            );

        positions.setZ(
            i,
            height
        );

        average+=height;

    }

    average/=
        positions.count;

    geometry.rotateX(
        -Math.PI/2
    );

    geometry.computeVertexNormals();

    const mesh=
        new THREE.Mesh(
            geometry,
            materialForHeight(
                average
            )
        );

    mesh.position.set(
        cx*size,
        0,
        cz*size
    );

    mesh.receiveShadow=true;

    mesh.castShadow=false;

    mesh.frustumCulled=true;

    mesh.userData.cx=cx;

    mesh.userData.cz=cz;

    scene.add(
        mesh
    );

    chunks.set(
        key,
        mesh
    );

    createChunkObjects(
        cx,
        cz
    );

}


// Stream world around player

function streamWorld(x,z){

    const cx=
        Math.floor(
            x/
            CONFIG.chunkSize
        );

    const cz=
        Math.floor(
            z/
            CONFIG.chunkSize
        );

    for(
        let dx=-CONFIG.renderRadius;
        dx<=CONFIG.renderRadius;
        dx++
    ){

        for(
            let dz=-CONFIG.renderRadius;
        dz<=CONFIG.renderRadius;
        dz++
        ){

            createChunk(
                cx+dx,
                cz+dz
            );

        }

    }

}


// Player state

const player={

    position:
        new THREE.Vector3(),

    velocity:
        new THREE.Vector3(),

    yaw:0,

    pitch:0,

    grounded:false

};


player.position.set(
    0,
    terrainHeight(
        0,
        0
    )+
    CONFIG.playerHeight,
    0
);


// Input state

const keys=
    new Set();

let sprint=false;


// Keyboard input

window.addEventListener(
    "keydown",
    event => {

        keys.add(
            event.key.toLowerCase()
        );

        if(
            event.code==="Space"
        ){

            jump();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys.delete(
            event.key.toLowerCase()
        );

    }
);


// Movement direction

const movement=
    new THREE.Vector3();

const forward=
    new THREE.Vector3();

const right=
    new THREE.Vector3();

function movementDirection(){

    movement.set(
        0,
        0,
        0
    );

    forward.set(
        Math.sin(
            player.yaw
        ),
        0,
        Math.cos(
            player.yaw
        )
    );

    right.set(
        Math.cos(
            player.yaw
        ),
        0,
        -Math.sin(
            player.yaw
        )
    );

    if(
        keys.has("w")||
        keys.has("arrowup")
    ){

        movement.add(
            forward
        );

    }

    if(
        keys.has("s")||
        keys.has("arrowdown")
    ){

        movement.sub(
            forward
        );

    }

    if(
        keys.has("d")||
        keys.has("arrowright")
    ){

        movement.add(
            right
        );

    }

    if(
        keys.has("a")||
        keys.has("arrowleft")
    ){

        movement.sub(
            right
        );

    }

    if(
        movement.lengthSq()>1
    ){

        movement.normalize();

    }

    return movement;

}


// Physics derivative

const derivativePosition=
    new THREE.Vector3();

const derivativeVelocity=
    new THREE.Vector3();

function derivative(){

    const direction=
        movementDirection();

    derivativePosition.copy(
        player.velocity
    );

    derivativeVelocity.set(
        direction.x*
        CONFIG.acceleration,

        CONFIG.gravity,

        direction.z*
        CONFIG.acceleration
    );

}


// RK4 temporary vectors

const rkP0=
    new THREE.Vector3();

const rkV0=
    new THREE.Vector3();

const k1p=
    new THREE.Vector3();

const k1v=
    new THREE.Vector3();

const k2p=
    new THREE.Vector3();

const k2v=
    new THREE.Vector3();

const k3p=
    new THREE.Vector3();

const k3v=
    new THREE.Vector3();

const k4p=
    new THREE.Vector3();

const k4v=
    new THREE.Vector3();


// RK4 integration

function rk4(dt){

    rkP0.copy(
        player.position
    );

    rkV0.copy(
        player.velocity
    );

    derivative();

    k1p.copy(
        derivativePosition
    );

    k1v.copy(
        derivativeVelocity
    );

    player.position.copy(
        rkP0
    ).addScaledVector(
        k1p,
        dt*.5
    );

    player.velocity.copy(
        rkV0
    ).addScaledVector(
        k1v,
        dt*.5
    );

    derivative();

    k2p.copy(
        derivativePosition
    );

    k2v.copy(
        derivativeVelocity
    );

    player.position.copy(
        rkP0
    ).addScaledVector(
        k2p,
        dt*.5
    );

    player.velocity.copy(
        rkV0
    ).addScaledVector(
        k2v,
        dt*.5
    );

    derivative();

    k3p.copy(
        derivativePosition
    );

    k3v.copy(
        derivativeVelocity
    );

    player.position.copy(
        rkP0
    ).addScaledVector(
        k3p,
        dt
    );

    player.velocity.copy(
        rkV0
    ).addScaledVector(
        k3v,
        dt
    );

    derivative();

    k4p.copy(
        derivativePosition
    );

    k4v.copy(
        derivativeVelocity
    );

    player.position.copy(
        rkP0
    );

    player.velocity.copy(
        rkV0
    );

    player.position.x+=
        dt/6*
        (
            k1p.x+
            2*k2p.x+
            2*k3p.x+
            k4p.x
        );

    player.position.y+=
        dt/6*
        (
            k1p.y+
            2*k2p.y+
            2*k3p.y+
            k4p.y
        );

    player.position.z+=
        dt/6*
        (
            k1p.z+
            2*k2p.z+
            2*k3p.z+
            k4p.z
        );

    player.velocity.x+=
        dt/6*
        (
            k1v.x+
            2*k2v.x+
            2*k3v.x+
            k4v.x
        );

    player.velocity.y+=
        dt/6*
        (
            k1v.y+
            2*k2v.y+
            2*k3v.y+
            k4v.y
        );

    player.velocity.z+=
        dt/6*
        (
            k1v.z+
            2*k2v.z+
            2*k3v.z+
            k4v.z
        );

}


// Physics update

function updatePhysics(dt){

    rk4(dt);

    const maxSpeed=
        sprint?
        CONFIG.sprintSpeed:
        CONFIG.walkSpeed;

    const horizontalSpeed=
        Math.hypot(
            player.velocity.x,
            player.velocity.z
        );

    if(
        horizontalSpeed>
        maxSpeed
    ){

        const factor=
            maxSpeed/
            horizontalSpeed;

        player.velocity.x*=
            factor;

        player.velocity.z*=
            factor;

    }

    const drag=
        Math.exp(
            -8*dt
        );

    player.velocity.x*=
        drag;

    player.velocity.z*=
        drag;

    const ground=
        terrainHeight(
            player.position.x,
            player.position.z
        )+
        CONFIG.playerHeight;

    if(
        player.position.y<=
        ground
    ){

        player.position.y=
            ground;

        if(
            player.velocity.y<0
        ){

            player.velocity.y=0;

        }

        player.grounded=true;

    }
    else{

        player.grounded=false;

    }

}


// Jump

function jump(){

    if(
        player.grounded
    ){

        player.velocity.y=
            CONFIG.jumpVelocity;

        player.grounded=false;

    }

}


// Camera quaternion

const cameraQuaternion=
    new THREE.Quaternion();

const cameraEuler=
    new THREE.Euler(
        0,
        0,
        0,
        "YXZ"
    );

function updateCamera(){

    camera.position.copy(
        player.position
    );

    cameraEuler.set(
        player.pitch,
        player.yaw,
        0,
        "YXZ"
    );

    cameraQuaternion.setFromEuler(
        cameraEuler
    );

    camera.quaternion.copy(
        cameraQuaternion
    );

}


// Touch button binding

function bindButton(id,key){

    const button=
        document.getElementById(
            id
        );

    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            keys.add(key);

            button.setPointerCapture(
                event.pointerId
            );

        }
    );

    button.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();

            keys.delete(key);

        }
    );

    button.addEventListener(
        "pointercancel",
        () => {

            keys.delete(key);

        }
    );

}


bindButton(
    "forward",
    "w"
);

bindButton(
    "back",
    "s"
);

bindButton(
    "left",
    "a"
);

bindButton(
    "right",
    "d"
);


document
.getElementById("jump")
.addEventListener(
    "pointerdown",

);

// Camera look

let looking=false;

let lastX=0;

let lastY=0;


renderer.domElement.addEventListener(
    "pointerdown",
    event => {

        looking=true;

        lastX=
            event.clientX;

        lastY=
            event.clientY;

    }
);


window.addEventListener(
    "pointerup",
    () => {

        looking=false;

    }
);


window.addEventListener(
    "pointermove",
    event => {

        if(!looking){

            return;

        }

        const dx=
            event.clientX-
            lastX;

        const dy=
            event.clientY-
            lastY;

        lastX=
            event.clientX;

        lastY=
            event.clientY;

        player.yaw-=
            dx*.004;

        player.pitch-=
            dy*.004;

        player.pitch=
            THREE.MathUtils.clamp(
                player.pitch,
                -1.45,
                1.45
            );

    }
);


// A* pathfinding

function aStar(start,end){

    const open=[
        start
    ];

    const came=
        new Map();

    const cost=
        new Map();

    cost.set(
        start,
        0
    );

    function heuristic(node){

        const p=
            node
            .split(",")
            .map(Number);

        const e=
            end
            .split(",")
            .map(Number);

        return Math.hypot(
            p[0]-e[0],
            p[1]-e[1]
        );

    }

    while(
        open.length>0
    ){

        let bestIndex=0;

        let bestScore=
            Infinity;

        for(
            let i=0;
            i<open.length;
            i++
        ){

            const node=
                open[i];

            const score=
                cost.get(node)+
                heuristic(node);

            if(
                score<
                bestScore
            ){

                bestScore=
                    score;

                bestIndex=i;

            }

        }

        const current=
            open.splice(
                bestIndex,
                1
            )[0];

        if(
            current===end
        ){

            const result=[];

            let node=
                current;

            while(node){

                result.push(
                    node
                );

                node=
                    came.get(node);

            }

            return result.reverse();

        }

        const parts=
            current
            .split(",")
            .map(Number);

        const x=parts[0];

        const z=parts[1];

        const neighbors=[

            [1,0],
            [-1,0],
            [0,1],
            [0,-1]

        ];

        for(
            let i=0;
            i<neighbors.length;
            i++
        ){

            const dx=
                neighbors[i][0];

            const dz=
                neighbors[i][1];

            const nx=
                x+dx;

            const nz=
                z+dz;

            const next=
                nx+","+nz;

            const currentHeight=
                terrainHeight(
                    x*4,
                    z*4
                );

            const nextHeight=
                terrainHeight(
                    nx*4,
                    nz*4
                );

            const heightDifference=
                Math.abs(
                    currentHeight-
                    nextHeight
                );

            const newCost=
                cost.get(current)+
                1+
                heightDifference*.04;

            if(
                !cost.has(next)||
                newCost<
                cost.get(next)
            ){

                cost.set(
                    next,
                    newCost
                );

                came.set(
                    next,
                    current
                );

                if(
                    !open.includes(next)
                ){

                    open.push(
                        next
                    );

                }

            }

        }

    }

    return [];

}


const demonstrationPath=
    aStar(
        "0,0",
        "15,12"
    );


// Day and night

let dayTime=0;

function updateSun(dt){

    dayTime+=
        dt*.03;

    const angle=
        dayTime;

    const sunHeight=
        Math.sin(
            angle
        );

    sun.position.set(
        Math.cos(angle)*180,
        40+
        Math.max(
            0,
            sunHeight
        )*180,
        Math.sin(angle)*140
    );

    const daylight=
        Math.max(
            0,
            sunHeight
        );

    sun.intensity=
        .2+
        daylight*2;

    hemisphere.intensity=
        .5+
        daylight*1.2;

}


// Performance counters

let renderedFrames=0;

let fpsTime=0;

let fps=0;

let totalFrame=0;


// HUD update

function updateHUD(dt){

    renderedFrames++;

    totalFrame++;

    fpsTime+=dt;

    if(
        fpsTime>=1
    ){

        fps=
            renderedFrames/
            fpsTime;

        renderedFrames=0;

        fpsTime=0;

    }

    const p=
        player.position;

    const v=
        player.velocity;

    document.getElementById(
        "fps"
    ).textContent=
        fps.toFixed(0);

    document.getElementById(
        "frame"
    ).textContent=
        totalFrame;

    document.getElementById(
        "pos"
    ).textContent=
        p.x.toFixed(1)+
        " "+
        p.y.toFixed(1)+
        " "+
        p.z.toFixed(1);

    document.getElementById(
        "vel"
    ).textContent=
        v.x.toFixed(1)+
        " "+
        v.y.toFixed(1)+
        " "+
        v.z.toFixed(1);

    document.getElementById(
        "terrain"
    ).textContent=
        terrainHeight(
            p.x,
            p.z
        ).toFixed(2);

    document.getElementById(
        "slope"
    ).textContent=
        terrainSlope(
            p.x,
            p.z
        ).toFixed(3);

    document.getElementById(
        "biome"
    ).textContent=
        getBiome(
            p.x,
            p.z
        );

    document.getElementById(
        "chunks"
    ).textContent=
        chunks.size;

    document.getElementById(
        "instances"
    ).textContent=
        objects.children.length;

    document.getElementById(
        "cache"
    ).textContent=
        heightCache.size();

    document.getElementById(
        "path"
    ).textContent=
        demonstrationPath.length;

    document.getElementById(
        "seed"
    ).textContent=
        CONFIG.seed;

}


// Initial world

streamWorld(
    player.position.x,
    player.position.z
);


// Fixed timestep accumulator

let accumulator=0;

let previousTime=
    performance.now();


// Main engine loop

function engineLoop(now){

    requestAnimationFrame(
        engineLoop
    );

    let frameTime=
        (now-previousTime)/
        1000;

    previousTime=now;

    frameTime=
        Math.min(
            frameTime,
            .1
        );

    accumulator+=
        frameTime;

    while(
        accumulator>=
        CONFIG.fixedStep
    ){

        updatePhysics(
            CONFIG.fixedStep
        );

        accumulator-=
            CONFIG.fixedStep;

    }

    updateCamera();

    updateSun(
        frameTime
    );

    updateHUD(
        frameTime
    );

    renderer.render(
        scene,
        camera
    );

}


// Start engine

requestAnimationFrame(
    engineLoop
);


// Resize handling

window.addEventListener(
    "resize",
    () => {

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);
