// ==============================
// MATHEMATICAL TERRAIN
// ==============================

const CHUNK_SIZE = 100;
const TERRAIN_SEGMENTS = 32;
const VIEW_DISTANCE = 2;

const chunkMap = new Map();
const terrainCache = new Map();

function hash(x,z){

    let n = Math.sin(
        x * 127.1 +
        z * 311.7
    ) * 43758.5453123;

    return n - Math.floor(n);
}

function smooth(t){
    return t * t * (3 - 2 * t);
}

function noise(x,z){

    const x0 = Math.floor(x);
    const z0 = Math.floor(z);

    const x1 = x0 + 1;
    const z1 = z0 + 1;

    const sx = smooth(x - x0);
    const sz = smooth(z - z0);

    const n00 = hash(x0,z0);
    const n10 = hash(x1,z0);
    const n01 = hash(x0,z1);
    const n11 = hash(x1,z1);

    const ix0 = THREE.MathUtils.lerp(n00,n10,sx);
    const ix1 = THREE.MathUtils.lerp(n01,n11,sx);

    return THREE.MathUtils.lerp(ix0,ix1,sz);
}

function fbm(x,z){

    let value = 0;
    let amplitude = 0.5;
    let frequency = 1;

    for(let i=0;i<6;i++){

        value += noise(
            x * frequency,
            z * frequency
        ) * amplitude;

        frequency *= 2;
        amplitude *= 0.5;
    }

    return value;
}

function ridged(x,z){

    let n = fbm(x,z);

    n = 1 - Math.abs(n * 2 - 1);

    return n * n;
}

function rawHeight(x,z){

    const continental =
        fbm(x * 0.0025,z * 0.0025);

    const mountains =
        ridged(x * 0.008,z * 0.008);

    const detail =
        fbm(x * 0.04,z * 0.04);

    let h =
        continental * 35 +
        mountains * 32 +
        detail * 2;

    h -= 12;

    return h;
}


// ==============================
// EXACT TERRAIN HEIGHT CACHE
// ==============================

function terrainHeight(x,z){

    const gx = Math.floor(x * 2) / 2;
    const gz = Math.floor(z * 2) / 2;

    const key = gx + "," + gz;

    const cached = terrainCache.get(key);

    if(cached !== undefined){
        return cached;
    }

    const h = rawHeight(gx,gz);

    terrainCache.set(key,h);

    if(terrainCache.size > 50000){
        const first = terrainCache.keys().next().value;
        terrainCache.delete(first);
    }

    return h;
}

function terrainSlope(x,z){

    const e = 0.5;

    const hL = terrainHeight(x-e,z);
    const hR = terrainHeight(x+e,z);
    const hD = terrainHeight(x,z-e);
    const hU = terrainHeight(x,z+e);

    const dx = (hR-hL)/(2*e);
    const dz = (hU-hD)/(2*e);

    return Math.sqrt(
        dx*dx +
        dz*dz
    );
}

function terrainNormal(x,z){

    const e = 0.5;

    const hL = terrainHeight(x-e,z);
    const hR = terrainHeight(x+e,z);
    const hD = terrainHeight(x,z-e);
    const hU = terrainHeight(x,z+e);

    const normal = new THREE.Vector3(
        hL-hR,
        2*e,
        hD-hU
    );

    return normal.normalize();
}


// ==============================
// BIOMES
// ==============================

function getBiome(x,z){

    const h = terrainHeight(x,z);
    const moisture = fbm(
        x*0.006+300,
        z*0.006+700
    );

    if(h < 0){
        return "water";
    }

    if(h < 6){
        return "plains";
    }

    if(h < 18){

        if(moisture > 0.58){
            return "forest";
        }

        return "grass";
    }

    if(h < 35){
        return "rock";
    }

    return "mountain";
}

// TERRAIN MATERIALS

const materials = {

    }),

sunLight.shadow.camera.top = 250;
sunLight.shadow.camera.bottom = -250;

sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 1000;

// ==============================
// AMBIENT LIGHT
// ==============================

const ambientLight = new THREE.HemisphereLight(

scene.add(ambientLight);


// ==============================
// SUN VISUAL
// ==============================

    })
);

scene.add(sunSphere);


// ==============================
// TERRAIN CHUNKS
// ==============================

function chunkKey(cx,cz){
    return cx + "," + cz;
}

function createChunk(cx,cz){

    const key = chunkKey(cx,cz);

    if(chunkMap.has(key)){
        return;
    }

    const geometry = new THREE.PlaneGeometry(
        CHUNK_SIZE,
        CHUNK_SIZE,
        TERRAIN_SEGMENTS,
        TERRAIN_SEGMENTS
    );

    geometry.rotateX(-Math.PI/2);

    const position =
        geometry.attributes.position;

    for(let i=0;i<position.count;i++){

        const lx = position.getX(i);
        const lz = position.getZ(i);

        const wx =
            cx * CHUNK_SIZE +
            lx;

        const wz =
            cz * CHUNK_SIZE +
            lz;

        const h =
            terrainHeight(wx,wz);

        position.setY(i,h);
    }

    position.needsUpdate = true;

    geometry.computeVertexNormals();

    const centerX =
        cx * CHUNK_SIZE;

    const centerZ =
        cz * CHUNK_SIZE;

    const centerHeight =
        terrainHeight(
            centerX,
            centerZ
        );

    const biome =
        getBiome(
            centerX,
            centerZ
        );

    const mesh = new THREE.Mesh(
        geometry,
        materials[biome] || materials.grass
    );

    mesh.position.set(
        centerX,
        0,
        centerZ
    );

    mesh.receiveShadow = true;
    mesh.castShadow = false;

    scene.add(mesh);

    chunkMap.set(key,{
        mesh,
        cx,
        cz
    });

    createChunkObjects(
        cx,
        cz
    );
}


// ==============================
// PROCEDURAL OBJECTS
// ==============================

const treeTrunkGeometry =
    new THREE.CylinderGeometry(
        0.45,
        0.7,
        5,
        7
    );

const treeLeavesGeometry =
    new THREE.ConeGeometry(
        3.2,
        8,
        8
    );

const rockGeometry =
    new THREE.DodecahedronGeometry(
        1.8,
        0
    );

const trunkMaterial =
    new THREE.MeshStandardMaterial({
        color:0x5b3925,
        roughness:1
    });

const leavesMaterial =
    new THREE.MeshStandardMaterial({
        color:0x214b26,
        roughness:1
    });

const rockMaterial =
    new THREE.MeshStandardMaterial({
        color:0x686868,
        roughness:1
    });


function createTree(x,z,scale){

    const ground =
        terrainHeight(x,z);

    const trunk =
        new THREE.Mesh(
            treeTrunkGeometry,
            trunkMaterial
        );

    trunk.position.set(
        x,
        ground + 2.5 * scale,
        z
    );

    trunk.scale.setScalar(scale);

    trunk.castShadow = true;
    trunk.receiveShadow = true;

    scene.add(trunk);


    const leaves =
        new THREE.Mesh(
            treeLeavesGeometry,
            leavesMaterial
        );

    leaves.position.set(
        x,
        ground + 7 * scale,
        z
    );

    leaves.scale.setScalar(scale);

    leaves.castShadow = true;

    scene.add(leaves);
}


function createRock(x,z,scale){

    const ground =
        terrainHeight(x,z);

    const rock =
        new THREE.Mesh(
            rockGeometry,
            rockMaterial
        );

    rock.position.set(
        x,
        ground + scale * 0.8,
        z
    );

    rock.scale.setScalar(scale);

    rock.rotation.set(
        hash(x,z)*3,
        hash(z,x)*3,
        hash(x+50,z+20)*3
    );

    rock.castShadow = true;
    rock.receiveShadow = true;

    scene.add(rock);
}


function createChunkObjects(cx,cz){

    const baseX =
        cx * CHUNK_SIZE -
        CHUNK_SIZE/2;

    const baseZ =
        cz * CHUNK_SIZE -
        CHUNK_SIZE/2;

    for(let i=0;i<18;i++){

        const x =
            baseX +
            hash(
                cx*100+i,
                cz*200+i
            ) * CHUNK_SIZE;

        const z =
            baseZ +
            hash(
                cx*300+i,
                cz*400+i
            ) * CHUNK_SIZE;

        const h =
            terrainHeight(x,z);

        const slope =
            terrainSlope(x,z);

        const biome =
            getBiome(x,z);

        if(
            biome === "forest" &&
            h > 4 &&
            slope < 1.5
        ){

            const scale =
                0.7 +
                hash(i,cx+cz)*0.7;

            createTree(
                x,
                z,
                scale
            );

        }else if(
            biome === "grass" &&
            slope < 2.5 &&
            hash(cx+i,cz-i) > 0.6
        ){

            createTree(
                x,
                z,
                0.6 +
                hash(z,i)*0.5
            );

        }else if(
            biome === "rock" ||
            biome === "mountain"
        ){

            if(hash(i*7,cx*3+cz) > 0.4){

                createRock(
                    x,
                    z,
                    0.5 +
                    hash(z*2,i)*1.2
                );
            }
        }
    }
}


// ==============================
// WORLD STREAMING
// ==============================

function updateWorld(){

    const cx =
        Math.floor(
            player.position.x /
            CHUNK_SIZE
        );

    const cz =
        Math.floor(
            player.position.z /
            CHUNK_SIZE
        );

    for(
        let x=-VIEW_DISTANCE;
        x<=VIEW_DISTANCE;
        x++
    ){

        for(
            let z=-VIEW_DISTANCE;
            z<=VIEW_DISTANCE;
            z++
        ){

            createChunk(
                cx+x,
                cz+z
            );
        }
    }
}


// ==============================
// PLAYER
// ==============================

const player = {

    position:new THREE.Vector3(
        0,
        terrainHeight(0,0)+2,
        0
    ),

    velocity:new THREE.Vector3(),

    yaw:0,

    pitch:0,

    height:1.8,

    grounded:false,

    speed:12,

    gravity:-35,

    jumpPower:12
};


// ==============================
// INPUT
// ==============================

const keys = {};

addEventListener(
    "keydown",
    e => {
        keys[e.code] = true;

        if(
            e.code === "Space" &&
            player.grounded
        ){

            player.velocity.y =
                player.jumpPower;

            player.grounded = false;
        }
    }
);

addEventListener(
    "keyup",
    e => {
        keys[e.code] = false;
    }
);


// ==============================
// MOBILE JOYSTICK
// ==============================

let joystickActive = false;
let joystickX = 0;
let joystickY = 0;

let joystickPointer = null;

const joystickSize = 150;

const joystick = {
    x:0,
    y:0
};


// ==============================
// TOUCH CONTROLS
// ==============================

const touchCanvas =
    renderer.domElement;

touchCanvas.addEventListener(
    "pointerdown",
    e => {

        if(
            e.pointerType !== "touch"
        ){
            return;
        }

        if(
            e.clientX <
            innerWidth * 0.45
        ){
            joystickActive = true;
            joystickPointer = e.pointerId;
            joystick.x = e.clientX;
            joystick.y = e.clientY;
            joystickX = 0;
            joystickY = 0;
            return;
        }

        touchCanvas.setPointerCapture(
            e.pointerId
        );

        touchLook.active = true;
        touchLook.lastX = e.clientX;
        touchLook.lastY = e.clientY;
    }
);

touchCanvas.addEventListener(
    "pointermove",
    e => {

        if(
            e.pointerType !== "touch"
        ){
            return;
        }

        if(
            joystickActive &&
            e.pointerId === joystickPointer
        ){

            const dx =
                e.clientX - joystick.x;

            const dy =
                e.clientY - joystick.y;

            const max =
                65;

            joystickX =
                THREE.MathUtils.clamp(
                    dx/max,
                    -1,
                    1
                );

            joystickY =
                THREE.MathUtils.clamp(
                    dy/max,
                    -1,
                    1
                );

            return;
        }

        if(touchLook.active){

            const dx =
                e.clientX -
                touchLook.lastX;

            const dy =
                e.clientY -
                touchLook.lastY;

            player.yaw -=
                dx * 0.003;

            player.pitch -=
                dy * 0.003;

            player.pitch =
                THREE.MathUtils.clamp(
                    player.pitch,
                    -1.45,
                    1.45
                );

            touchLook.lastX =
                e.clientX;

            touchLook.lastY =
                e.clientY;
        }
    }
);

touchCanvas.addEventListener(
    "pointerup",
    e => {

        if(
            e.pointerType !== "touch"
        ){
            return;
        }

        if(
            e.pointerId ===
            joystickPointer
        ){

            joystickActive = false;
            joystickPointer = null;
            joystickX = 0;
            joystickY = 0;
        }

        touchLook.active = false;
    }
);

touchCanvas.addEventListener(
    "pointercancel",
    e => {

        if(
            e.pointerId ===
            joystickPointer
        ){

            joystickActive = false;
            joystickPointer = null;
            joystickX = 0;
            joystickY = 0;
        }

        touchLook.active = false;
    }
);


const touchLook = {
    active:false,
    lastX:0,
    lastY:0
};


// ==============================
// CAMERA MOUSE LOOK
// ==============================

let mouseLocked = false;

renderer.domElement.addEventListener(
    "click",
    () => {

        if(
            innerWidth > 700
        ){
            renderer.domElement.requestPointerLock();
        }
    }
);

document.addEventListener(
    "pointerlockchange",
    () => {

        mouseLocked =
            document.pointerLockElement ===
            renderer.domElement;
    }
);

document.addEventListener(
    "mousemove",
    e => {

        if(!mouseLocked){
            return;
        }

        player.yaw -=
            e.movementX * 0.002;

        player.pitch -=
            e.movementY * 0.002;

        player.pitch =
            THREE.MathUtils.clamp(
                player.pitch,
                -1.45,
                1.45
            );
    }
);


// ==============================
// MOVEMENT
// ==============================

const moveDirection =
    new THREE.Vector3();

const forward =
    new THREE.Vector3();

const right =
    new THREE.Vector3();

function updateMovement(dt){

    let forwardInput = 0;
    let rightInput = 0;

    if(keys["KeyW"]){
        forwardInput += 1;
    }

    if(keys["KeyS"]){
        forwardInput -= 1;
    }

    if(keys["KeyD"]){
        rightInput += 1;
    }

    if(keys["KeyA"]){
        rightInput -= 1;
    }


    if(joystickActive){

        // Negative Y is forward on a normal joystick.
        forwardInput =
            -joystickY;

        rightInput =
            joystickX;
    }


    moveDirection.set(
        0,
        0,
        0
    );


    // Forward points in the direction
    // the camera is facing.

    forward.set(
        -Math.sin(player.yaw),
        0,
        -Math.cos(player.yaw)
    );

    right.set(
        Math.cos(player.yaw),
        0,
        -Math.sin(player.yaw)
    );


    moveDirection.addScaledVector(
        forward,
        forwardInput
    );

    moveDirection.addScaledVector(
        right,
        rightInput
    );


    if(moveDirection.lengthSq() > 1){
        moveDirection.normalize();
    }


    const acceleration =
        player.grounded
        ? 55
        : 20;


    player.velocity.x =
        THREE.MathUtils.damp(
            player.velocity.x,
            moveDirection.x *
            player.speed,
            acceleration,
            dt
        );

    player.velocity.z =
        THREE.MathUtils.damp(
            player.velocity.z,
            moveDirection.z *
            player.speed,
            acceleration,
            dt
        );
}


// ==============================
// PLAYER PHYSICS
// ==============================

function updatePhysics(dt){

    updateMovement(dt);


    player.velocity.y +=
        player.gravity * dt;


    player.position.x +=
        player.velocity.x * dt;

    player.position.z +=
        player.velocity.z * dt;

    player.position.y +=
        player.velocity.y * dt;


    const ground =
        terrainHeight(
            player.position.x,
            player.position.z
        );


    const playerGround =
        ground +
        player.height;


    if(
        player.position.y <=
        playerGround
    ){

        player.position.y =
            playerGround;

        if(player.velocity.y < 0){
            player.velocity.y = 0;
        }

        player.grounded = true;

    }else{

        player.grounded = false;
    }
}


// ==============================
// CAMERA
// ==============================

function updateCamera(){

    camera.position.copy(
        player.position
    );

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        player.yaw;

    camera.rotation.x =
        player.pitch;
}


// ==============================
// DAY / NIGHT
// ==============================

let worldTime = 8;

const DAY_LENGTH =
    180;

function updateDayNight(dt){

    worldTime +=
        dt *
        24 /
        DAY_LENGTH;

    if(worldTime >= 24){
        worldTime -= 24;
    }


    const angle =
        (worldTime / 24) *
        Math.PI * 2;


    const sunRadius = 700;


    const sunX =
        Math.cos(angle) *
        sunRadius;

    const sunY =
        Math.sin(angle) *
        sunRadius;

    const sunZ =
        250;


    sunLight.position.set(
        sunX,
        sunY,
        sunZ
    );

    sunSphere.position.copy(
        sunLight.position
    );


    const daylight =
        Math.max(
            0,
            Math.sin(angle)
        );


    const dawn =
        Math.max(
            0,
            1 -
            Math.abs(
                daylight - 0.3
            ) * 3
        );


    sunLight.intensity =
        0.15 +
        daylight * 2.0;


    ambientLight.intensity =
        0.18 +
        daylight * 0.85;


    const skyDay =
        new THREE.Color(
            0x72a8d8
        );

    const skyNight =
        new THREE.Color(
            0x071329
        );

    const skyColor =
        skyNight.clone().lerp(
            skyDay,
            Math.pow(
                daylight,
                0.45
            )
        );


    skyMaterial.color.copy(
        skyColor
    );


    scene.fog.color.copy(
        skyColor
    );


    sunLight.color.setHSL(
        THREE.MathUtils.lerp(
            0.08,
            0.13,
            daylight
        ),
        0.8,
        THREE.MathUtils.lerp(
            0.65,
            1,
            daylight
        )
    );


    ambientLight.color.copy(
        skyColor
    );


    const hour =
        Math.floor(worldTime);

    const minute =
        Math.floor(
            (worldTime-hour)*60
        );


    document.title =
        "World " +
        String(hour).padStart(2,"0") +
        ":" +
        String(minute).padStart(2,"0");
}


// ==============================
// FOG
// ==============================

scene.fog =
    new THREE.Fog(
        0x72a8d8,
        300,
        1800
    );


// ==============================
// INITIAL WORLD
// ==============================

createChunk(
    0,
    0
);

updateWorld();


// ==============================
// RESIZE
// ==============================

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.5
            )
        );
    }
);


// ==============================
// MAIN LOOP
// ==============================

let previousTime =
    performance.now();

let accumulator = 0;

const FIXED_STEP =
    1/120;

let worldUpdateTimer = 0;


function animate(now){

    requestAnimationFrame(
        animate
    );


    let dt =
        (now - previousTime) /
        1000;

    previousTime = now;


    dt =
        Math.min(
            dt,
            0.1
        );


    accumulator += dt;


    while(
        accumulator >=
        FIXED_STEP
    ){

        updatePhysics(
            FIXED_STEP
        );

        accumulator -=
            FIXED_STEP;
    }


    updateCamera();


    worldUpdateTimer += dt;

    if(
        worldUpdateTimer > 0.25
    ){

        updateWorld();

        worldUpdateTimer = 0;
    }


    updateDayNight(dt);


    // Keep the sky centered
    // around the player.

    sky.position.copy(
        camera.position
    );


    renderer.render(
        scene,
        camera
    );
}


requestAnimationFrame(
    animate
);

</script>

</body>
