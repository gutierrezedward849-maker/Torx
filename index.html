const CHUNK_SIZE = 100;

const TERRAIN_SEGMENTS = 32;

// ========================================
// RANDOM FUNCTIONS
// ========================================

function hash(x,z){

    const n =
        Math.sin(
            x*127.1 +
            z*311.7
        )*43758.5453123;

    return n -
        Math.floor(n);
}


function smooth(t){

    return t*t*(3-2*t);
}


function noise(x,z){

    const x0 =
        Math.floor(x);

    const z0 =
        Math.floor(z);

    const x1 =
        x0+1;

    const z1 =
        z0+1;


    const sx =
        smooth(x-x0);

    const sz =
        smooth(z-z0);


    const a =
        hash(x0,z0);

    const b =
        hash(x1,z0);

    const c =
        hash(x0,z1);

    const d =
        hash(x1,z1);


    const ab =
        THREE.MathUtils.lerp(
            a,b,sx
        );

    const cd =
        THREE.MathUtils.lerp(
            c,d,sx
        );


    return THREE.MathUtils.lerp(
        ab,
        cd,
        sz
    );
}


function fbm(x,z){

    let value = 0;

    let amplitude = .5;

    let frequency = 1;


    for(
        let i=0;
        i<5;
        i++
    ){

        value +=
            noise(
                x*frequency,
                z*frequency
            )*amplitude;

        frequency *= 2;

        amplitude *= .5;
    }


    return value;
}


// ========================================
// TERRAIN
// ========================================

const terrainCache =
    new Map();


function rawHeight(x,z){

    const large =
        fbm(
            x*.003,
            z*.003
        );

    const medium =
        fbm(
            x*.012,
            z*.012
        );

    const small =
        fbm(
            x*.04,
            z*.04
        );


    return (
        large*13 +
        medium*7 +
        small*2
    ) - 10;
}


function terrainHeight(x,z){

    const gx =
        Math.round(x*2)/2;

    const gz =
        Math.round(z*2)/2;


    const key =
        gx+","+gz;


    const old =
        terrainCache.get(key);


    if(old !== undefined){
        return old;
    }


    const h =
        rawHeight(
            gx,
            gz
        );


    terrainCache.set(
        key,
        h
    );


    return h;
}


function terrainNormal(x,z){

    const e = .35;


    const left =
        terrainHeight(
            x-e,
            z
        );

    const right =
        terrainHeight(
            x+e,
            z
        );

    const down =
        terrainHeight(
            x,
            z-e
        );

    const up =
        terrainHeight(
            x,
            z+e
        );


    return new THREE.Vector3(
        left-right,
        2*e,
        down-up
    ).normalize();
}


function terrainSlope(x,z){

    const n =
        terrainNormal(
            x,
            z
        );

    return Math.sqrt(
        n.x*n.x +
        n.z*n.z
    );
}


// ========================================
// SMALLER BIOMES
// ========================================

function biomeNoise(x,z){

    return fbm(
        x*.012+500,
        z*.012-800
    );
}


function moisture(x,z){

    return fbm(
        x*.018+1200,
        z*.018+700
    );
}


function temperature(x,z){

    return fbm(
        x*.015-500,
        z*.015+900
    );
}


function getBiome(x,z){

    const h =
        terrainHeight(
            x,
            z
        );

    const b =
        biomeNoise(
            x,
            z
        );

    const m =
        moisture(
            x,
            z
        );

    const t =
        temperature(
            x,
            z
        );


    if(h < -1.5){
        return "water";
    }


    if(
        h < 1.5 &&
        t > .45
    ){
        return "beach";
    }


    if(
        h < 7
    ){

        if(
            b > .62 &&
            m > .55
        ){
            return "forest";
        }

        if(
            b < .28 &&
            t > .58
        ){
            return "desert";
        }

        return "plains";
    }


    if(
        h < 13
    ){

        if(
            m > .56 &&
            b > .4
        ){
            return "forest";
        }

        if(
            t > .67 &&
            m < .43
        ){
            return "dryland";
        }

        return "grassland";
    }


    if(
        h < 20
    ){

        if(
            m > .55
        ){
            return "forest";
        }

        return "rock";
    }


    return "mountain";
}

// ========================================
// TERRAIN ALIGNMENT
// ========================================

function alignObject(
    object,
    x,
    z
){

    const normal =
        terrainNormal(
            x,
            z
        );


    object.quaternion
        .setFromUnitVectors(
            UP,
            normal
        );
}


// ========================================
// OBJECTS
// ========================================

function createTree(
    x,
    z,
    scale
){

    const ground =
        terrainHeight(
            x,
            z
        );


    const group =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            trunkGeometry,
            trunkMaterial
        );


    trunk.scale.setScalar(
        scale
    );


    trunk.position.y =
        1.75*scale;


    trunk.castShadow =
        true;


    const leaves =
        new THREE.Mesh(
            leavesGeometry,
            leavesMaterial
        );


    leaves.scale.setScalar(
        scale
    );


    leaves.position.y =
        5*scale;


    leaves.castShadow =
        true;


    group.add(
        trunk
    );

    group.add(
        leaves
    );


    group.position.set(
        x,
        ground,
        z
    );


    alignObject(
        group,
        x,
        z
    );


    scene.add(
        group
    );
}


function createBush(
    x,
    z,
    scale
){

    const ground =
        terrainHeight(
            x,
            z
        );


    const bush =
        new THREE.Mesh(
            bushGeometry,
            bushMaterial
        );


    bush.position.set(
        x,
        ground+.65*scale,
        z
    );


    bush.scale.set(
        1.2*scale,
        .65*scale,
        1.2*scale
    );


    bush.castShadow =
        true;


    alignObject(
        bush,
        x,
        z
    );


    scene.add(
        bush
    );
}


function createRock(
    x,
    z,
    scale
){

    const ground =
        terrainHeight(
            x,
            z
        );


    const rock =
        new THREE.Mesh(
            rockGeometry,
            rockMaterial
        );


    rock.position.set(
        x,
        ground+.45*scale,
        z
    );


    rock.scale.set(
        scale*1.15,
        scale*.7,
        scale
    );


    rock.rotation.y =
        hash(x,z)*
        Math.PI*2;


    rock.castShadow =
        true;


    alignObject(
        rock,
        x,
        z
    );


    scene.add(
        rock
    );
}


function createGrass(
    x,
    z,
    scale
){

    const ground =
        terrainHeight(
            x,
            z
        );


    const grass =
        new THREE.Mesh(
            grassGeometry,
            grassMaterial
        );


    grass.position.set(
        x,
        ground+.45*scale,
        z
    );


    grass.scale.setScalar(
        scale
    );


    grass.rotation.y =
        hash(
            x*4,
            z*5
        )*
        Math.PI*2;


    alignObject(
        grass,
        x,
        z
    );


    scene.add(
        grass
    );
}


function createFlower(
    x,
    z,
    scale
){

    const ground =
        terrainHeight(
            x,
            z
        );


    const flower =
        new THREE.Mesh(
            flowerGeometry,
            flowerMaterials[
                Math.floor(
                    hash(
                        x,
                        z
                    )*
                    flowerMaterials.length
                )
            ]
        );


    flower.position.set(
        x,
        ground+.7*scale,
        z
    );


    flower.scale.setScalar(
        scale
    );


    alignObject(
        flower,
        x,
        z
    );


    scene.add(
        flower
    );
}


// ========================================
// CHUNK VEGETATION
// ========================================

function createChunkObjects(
    cx,
    cz
){

    const startX =
        cx*CHUNK_SIZE -
        CHUNK_SIZE/2;

    const startZ =
        cz*CHUNK_SIZE -
        CHUNK_SIZE/2;


    // Dense small vegetation

    for(
        let i=0;
        i<110;
        i++
    ){

        const x =
            startX +
            hash(
                cx*1000+i,
                cz*2000+i
            )*
            CHUNK_SIZE;


        const z =
            startZ +
            hash(
                cx*3000+i,
                cz*4000+i
            )*
            CHUNK_SIZE;


        const biome =
            getBiome(
                x,
                z
            );


        const slope =
            terrainSlope(
                x,
                z
            );


        if(
            biome === "water" ||
            biome === "beach" ||
            slope > .7
        ){
            continue;
        }


        const r =
            hash(
                i*17+cx,
                i*31+cz
            );


        if(
            biome === "forest"
        ){

            if(r < .22){

                createTree(
                    x,
                    z,
                    .45 +
                    hash(z,i)*.45
                );

            }else if(
                r < .42
            ){

                createBush(
                    x,
                    z,
                    .35 +
                    r*.5
                );

            }else if(
                r < .86
            ){

                createGrass(
                    x,
                    z,
                    .45 +
                    r*.35
                );

            }else{

                createFlower(
                    x,
                    z,
                    .5
                );
            }

        }else if(
            biome === "plains" ||
            biome === "grassland"
        ){

            if(r < .07){

                createTree(
                    x,
                    z,
                    .4 +
                    r*2
                );

            }else if(
                r < .14
            ){

                createBush(
                    x,
                    z,
                    .35 +
                    r
                );

            }else if(
                r < .75
            ){

                createGrass(
                    x,
                    z,
                    .4 +
                    r*.35
                );

            }else{

                createFlower(
                    x,
                    z,
                    .45 +
                    r*.3
                );
            }

        }else if(
            biome === "dryland"
        ){

            if(r < .18){

                createBush(
                    x,
                    z,
                    .35
                );

            }else{

                createGrass(
                    x,
                    z,
                    .35
                );
            }

        }else if(
            biome === "desert"
        ){

            if(r < .12){

                createRock(
                    x,
                    z,
                    .35 +
                    r*.7
                );
            }

        }else if(
            biome === "rock" ||
            biome === "mountain"
        ){

            if(r < .45){

                createRock(
                    x,
                    z,
                    .35 +
                    r*.9
                );
            }
        }
    }
}


// ========================================
// CHUNKS
// ========================================

const chunks =
    new Map();


function chunkKey(cx,cz){

    return cx+","+cz;
}


function createChunk(
    cx,
    cz
){

    const key =
        chunkKey(
            cx,
            cz
        );


    if(
        chunks.has(key)
    ){
        return;
    }


    const geometry =
        new THREE.PlaneGeometry(
            CHUNK_SIZE,
            CHUNK_SIZE,
            TERRAIN_SEGMENTS,
            TERRAIN_SEGMENTS
        );


    geometry.rotateX(
        -Math.PI/2
    );


    const positions =
        geometry.attributes
        .position;


    for(
        let i=0;
        i<positions.count;
        i++
    ){

        const localX =
            positions.getX(i);

        const localZ =
            positions.getZ(i);


        const worldX =
            cx*CHUNK_SIZE +
            localX;

        const worldZ =
            cz*CHUNK_SIZE +
            localZ;


        positions.setY(
            i,
            terrainHeight(
                worldX,
                worldZ
            )
        );
    }


    positions.needsUpdate =
        true;


    geometry.computeVertexNormals();


    const centerX =
        cx*CHUNK_SIZE;

    const centerZ =
        cz*CHUNK_SIZE;


    const biome =
        getBiome(
            centerX,
            centerZ
        );


    const terrain =
        new THREE.Mesh(
            geometry,
            materials[
                biome
            ] ||
            materials.grassland
        );


    terrain.position.set(
        centerX,
        0,
        centerZ
    );


    terrain.receiveShadow =
        true;


    scene.add(
        terrain
    );


    chunks.set(
        key,
        terrain
    );


    createChunkObjects(
        cx,
        cz
    );
}

// ========================================
// MOBILE JOYSTICK
// ========================================

const joystick =
    document.getElementById(
        "joystick"
    );


const joystickKnob =
    document.getElementById(
        "joystickKnob"
    );


let joystickActive =
    false;

let joystickPointer =
    null;

let joystickX =
    0;

let joystickY =
    0;


function moveJoystick(
    x,
    y
){

    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width/2;

    const centerY =
        rect.top +
        rect.height/2;


    let dx =
        x-centerX;

    let dy =
        y-centerY;


    const radius =
        48;


    const length =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    if(
        length > radius
    ){

        dx =
            dx/length*
            radius;

        dy =
            dy/length*
            radius;
    }


    joystickX =
        dx/radius;

    joystickY =
        dy/radius;


    joystickKnob.style.transform =
        "translate("+
        dx+
        "px,"+
        dy+
        "px)";
}


joystick.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        joystickActive =
            true;

        joystickPointer =
            e.pointerId;


        joystick.setPointerCapture(
            e.pointerId
        );


        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
);


joystick.addEventListener(
    "pointermove",
    e => {

        if(
            !joystickActive ||
            e.pointerId !==
            joystickPointer
        ){
            return;
        }


        e.preventDefault();


        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
);


function releaseJoystick(){

    joystickActive =
        false;

    joystickPointer =
        null;

    joystickX =
        0;

    joystickY =
        0;


    joystickKnob.style.transform =
        "translate(0px,0px)";
}


joystick.addEventListener(
    "pointerup",
    releaseJoystick
);

joystick.addEventListener(
    "pointercancel",
    releaseJoystick
);


// ========================================
// JUMP
// ========================================

function jump(){

    if(
        player.grounded
    ){

        player.velocity.y =
            player.jumpPower;

        player.grounded =
            false;
    }
}


const jumpButton =
    document.getElementById(
        "jump"
    );


jumpButton.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        jump();
    }
);


// ========================================
// SPRINT
// ========================================

const sprintButton =
    document.getElementById(
        "sprint"
    );


sprintButton.addEventListener(
    "pointerdown",
    e => {

        e.preventDefault();

        player.sprinting =
            true;
    }
);


sprintButton.addEventListener(
    "pointerup",
    () => {

        player.sprinting =
            false;
    }
);


sprintButton.addEventListener(
    "pointercancel",
    () => {

        player.sprinting =
            false;
    }
);


// ========================================
// TOUCH CAMERA
// ========================================

const look = {

    active:false,

    pointer:null,

    x:0,

    y:0
};


renderer.domElement.addEventListener(
    "pointerdown",
    e => {

        if(
            e.pointerType !== "touch"
        ){
            return;
        }


        // Left side belongs to joystick.

        if(
            e.clientX <
            innerWidth*.45
        ){
            return;
        }


        look.active =
            true;

        look.pointer =
            e.pointerId;

        look.x =
            e.clientX;

        look.y =
            e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    e => {

        if(
            !look.active ||
            e.pointerId !==
            look.pointer
        ){
            return;
        }


        const dx =
            e.clientX-look.x;

        const dy =
            e.clientY-look.y;


        player.yaw -=
            dx*.003;


        player.pitch -=
            dy*.003;


        player.pitch =
            THREE.MathUtils.clamp(
                player.pitch,
                -1.45,
                1.45
            );


        look.x =
            e.clientX;

        look.y =
            e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    e => {

        if(
            e.pointerId ===
            look.pointer
        ){

            look.active =
                false;
        }
    }
);


// ========================================
// MOVEMENT
// ========================================

const move =
    new THREE.Vector3();


const forward =
    new THREE.Vector3();


const right =
    new THREE.Vector3();


function updateMovement(dt){

    let f =
        0;

    let r =
        0;


    if(keys["KeyW"]){
        f += 1;
    }

    if(keys["KeyS"]){
        f -= 1;
    }

    if(keys["KeyD"]){
        r += 1;
    }

    if(keys["KeyA"]){
        r -= 1;
    }


    if(joystickActive){

        // Pushing the joystick upward
        // produces positive forward input.

        f =
            -joystickY;

        r =
            joystickX;
    }


    forward.set(
        -Math.sin(
            player.yaw
        ),
        0,
        -Math.cos(
            player.yaw
        )
    );


    right.set(
        Math.cos(
            player.yaw
        ),
        0,
        -Math.sin(
            player.yaw
        )
    );


    move.set(
        0,
        0,
        0
    );


    move.addScaledVector(
        forward,
        f
    );


    move.addScaledVector(
        right,
        r
    );


    if(
        move.lengthSq()>1
    ){

        move.normalize();
    }


    const speed =
        player.sprinting
        ?
        player.sprintSpeed
        :
        player.speed;


    const acceleration =
        player.grounded
        ?
        65
        :
        20;


    player.velocity.x =
        THREE.MathUtils.damp(
            player.velocity.x,
            move.x*speed,
            acceleration,
            dt
        );


    player.velocity.z =
        THREE.MathUtils.damp(
            player.velocity.z,
            move.z*speed,
            acceleration,
            dt
        );
}


// ========================================
// PHYSICS
// ========================================

function updatePhysics(dt){

    updateMovement(dt);


    player.velocity.y +=
        player.gravity*dt;


    player.position.x +=
        player.velocity.x*dt;

    player.position.z +=
        player.velocity.z*dt;

    player.position.y +=
        player.velocity.y*dt;


    const ground =
        terrainHeight(
            player.position.x,
            player.position.z
        );


    const target =
        ground +
        player.height;


    if(
        player.position.y <=
        target
    ){

        player.position.y =
            target;

        player.velocity.y =
            0;

        player.grounded =
            true;

    }else{

        player.grounded =
            false;
    }
}


// ========================================
// CAMERA
// ========================================

function updateCamera(){

    camera.position.copy(
        player.position
    );


    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        player.yaw;

    camera.rotation.x =
        player.pitch;
}


// ========================================
// DAY NIGHT
// ========================================

let worldTime =
    8;


const DAY_LENGTH =
    180;


function updateDayNight(dt){

    worldTime +=
        dt*24/DAY_LENGTH;


    if(
        worldTime >= 24
    ){

        worldTime -=
            24;
    }


    const angle =
        worldTime/24*
        Math.PI*2;


    const radius =
        750;


    sun.position.set(
        Math.cos(angle)*radius,
        Math.sin(angle)*radius,
        250
    );


    sunVisual.position.copy(
        sun.position
    );


    const daylight =
        Math.max(
            0,
            Math.sin(angle)
        );


    sun.intensity =
        .1 +
        daylight*2.1;


    ambient.intensity =
        .2 +
        daylight*.85;


    const day =
        new THREE.Color(
            0x78a9d4
        );


    const night =
        new THREE.Color(
            0x071329
        );


    const skyColor =
        night.clone().lerp(
            day,
            Math.pow(
                daylight,
                .45
            )
        );


    skyMaterial.color.copy(
        skyColor
    );


    scene.fog.color.copy(
        skyColor
    );


    ambient.color.copy(
        skyColor
    );
}


// ========================================
// WORLD STREAMING
// ========================================

function updateWorld(){

    const cx =
        Math.floor(
            player.position.x/
            CHUNK_SIZE
        );


    const cz =
        Math.floor(
            player.position.z/
            CHUNK_SIZE
        );


    for(
        let x=-VIEW_DISTANCE;
        x<=VIEW_DISTANCE;
        x++
    ){

        for(
            let z=-VIEW_DISTANCE;
        z<=VIEW_DISTANCE;
        z++
        ){

            createChunk(
                cx+x,
                cz+z
            );
        }
    }
}


// ========================================
// START
// ========================================

createChunk(
    0,
    0
);

updateWorld();


// ========================================
// LOOP
// ========================================

let previous =
    performance.now();


let accumulator =
    0;


const FIXED =
    1/120;


let worldTimer =
    0;


function animate(now){

    requestAnimationFrame(
        animate
    );


    let dt =
        (now-previous)/1000;


    previous =
        now;


    dt =
        Math.min(
            dt,
            .1
        );


    accumulator +=
        dt;


    while(
        accumulator >= FIXED
    ){

        updatePhysics(
            FIXED
        );

        accumulator -=
            FIXED;
    }


    updateCamera();


    worldTimer +=
        dt;


    if(
        worldTimer>.2
    ){

        updateWorld();

        worldTimer =
            0;
    }


    updateDayNight(
        dt
    );


    sky.position.copy(
        camera.position
    );


    renderer.render(
        scene,
        camera
    );
}


requestAnimationFrame(
    animate
);


// ========================================
// RESIZE
// ========================================

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                1.4
            )
        );
    }
);

</script>

</body>
</html>
