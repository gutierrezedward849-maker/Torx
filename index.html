<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Procedural World</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87ceeb;
    touch-action: none;
    font-family: Arial, sans-serif;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
}

#controls {
    position: fixed;
    inset: 0;
    z-index: 1000;
    pointer-events: none;
}

#joystick {
    position: absolute;
    left: 25px;
    bottom: 30px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.16);
    border: 2px solid rgba(255,255,255,0.45);
    pointer-events: auto;
}

#stick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 58px;
    height: 58px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    border: 2px solid rgba(255,255,255,0.7);
}

.controlButton {
    position: absolute;
    pointer-events: auto;
    border: 2px solid rgba(255,255,255,0.55);
    background: rgba(0,0,0,0.35);
    color: white;
    font-weight: bold;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

#jump {
    right: 30px;
    bottom: 45px;
    width: 85px;
    height: 85px;
    border-radius: 50%;
}

#sprint {
    right: 125px;
    bottom: 45px;
    width: 70px;
    height: 70px;
    border-radius: 50%;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    transform: translate(-50%, -50%);
    z-index: 500;
    pointer-events: none;
}

#crosshair::before,
#crosshair::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,0.8);
}

#crosshair::before {
    width: 8px;
    height: 2px;
    top: 3px;
    left: 0;
}

#crosshair::after {
    width: 2px;
    height: 8px;
    left: 3px;
    top: 0;
}

@media (min-width: 800px) {
    #controls {
        display: none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="crosshair"></div>

<div id="controls">
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="sprint" class="controlButton">RUN</button>
    <button id="jump" class="controlButton">JUMP</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const canvas = document.getElementById("game");

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: false,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);

renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.rotation.order = "YXZ";

const clock = new THREE.Clock();

const UP = new THREE.Vector3(0, 1, 0);

const WORLD_SEED = 9137;

const CHUNK_SIZE = 80;
const TERRAIN_SEGMENTS = 20;
const VIEW_DISTANCE = 3;

const PLAYER_HEIGHT = 1.75;
const PLAYER_RADIUS = 0.35;

const WALK_SPEED = 5;
const SPRINT_SPEED = 9;
const JUMP_POWER = 7.5;
const GRAVITY = 20;

const terrainChunks = new Map();

const noiseCache = new Map();

let playerX = 0;
let playerY = 5;
let playerZ = 0;

let velocityY = 0;
let grounded = false;

let yaw = 0;
let pitch = 0;

let sprinting = false;

let worldTime = 8;

const keys = {
    w: false,
    a: false,
    s: false,
    d: false,
    shift: false,
    space: false
};

const joystick = {
    x: 0,
    y: 0,
    active: false,
    pointerId: null
};

function hash(x, z) {
    let h = x * 374761393 + z * 668265263 + WORLD_SEED * 1442695041;

    h = (h ^ (h >> 13)) * 1274126177;
    h = h ^ (h >> 16);

    return (h >>> 0) / 4294967295;
}

function smooth(t) {
    return t * t * (3 - 2 * t);
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function valueNoise(x, z, scale) {
    const sx = x / scale;
    const sz = z / scale;

    const x0 = Math.floor(sx);
    const z0 = Math.floor(sz);

    const x1 = x0 + 1;
    const z1 = z0 + 1;

    const tx = smooth(sx - x0);
    const tz = smooth(sz - z0);

    const a = hash(x0, z0);
    const b = hash(x1, z0);
    const c = hash(x0, z1);
    const d = hash(x1, z1);

    return lerp(
        lerp(a, b, tx),
        lerp(c, d, tx),
        tz
    );
}

function fbm(x, z, baseScale, octaves) {
    let value = 0;
    let amplitude = 0.5;
    let frequency = 1;
    let total = 0;

    for (let i = 0; i < octaves; i++) {
        value += valueNoise(
            x,
            z,
            baseScale / frequency
        ) * amplitude;

        total += amplitude;

        amplitude *= 0.5;
        frequency *= 2;
    }

    return value / total;
}

function terrainHeight(x, z) {
    const keyX = Math.floor(x * 2);
    const keyZ = Math.floor(z * 2);
    const key = keyX + "," + keyZ;

    if (noiseCache.has(key)) {
        return noiseCache.get(key);
    }

    const continent = fbm(x, z, 190, 3);
    const hills = fbm(x, z, 45, 4);
    const detail = fbm(x, z, 16, 3);

    let height = 0;

    height += (continent - 0.5) * 7;
    height += (hills - 0.5) * 8;
    height += (detail - 0.5) * 1.2;

    height = Math.max(-1.8, height);

    noiseCache.set(key, height);

    return height;
}

function moistureAt(x, z) {
    return fbm(x + 800, z - 400, 75, 3);
}

function temperatureAt(x, z) {
    return fbm(x - 1200, z + 900, 90, 3);
}

function biomeAt(x, z) {
    const h = terrainHeight(x, z);
    const moisture = moistureAt(x, z);
    const temperature = temperatureAt(x, z);

    if (h < -1.0) {
        return "water";
    }

    if (h < 0) {
        return "beach";
    }

    if (h > 8) {
        return "mountain";
    }

    if (h > 5.5) {
        return "rock";
    }

    if (temperature < 0.28 && moisture > 0.45) {
        return "forest";
    }

    if (moisture > 0.67) {
        return "forest";
    }

    if (temperature > 0.72 && moisture < 0.3) {
        return "desert";
    }

    if (moisture < 0.38) {
        return "dryland";
    }

    if (moisture > 0.5) {
        return "grassland";
    }

    return "plains";
}

const biomeColors = {
    water: 0x3979a8,
    beach: 0xcdbb78,
    plains: 0x78964e,
    grassland: 0x5f9848,
    forest: 0x477443,
    dryland: 0xa28b4d,
    desert: 0xc69b58,
    rock: 0x777777,
    mountain: 0x686868
};

const biomeMaterials = {};

for (const name in biomeColors) {
    biomeMaterials[name] = new THREE.MeshLambertMaterial({
        color: biomeColors[name]
    });
}

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(100, 150, 50);
scene.add(sun);

const ambient = new THREE.HemisphereLight(
    0xbfe7ff,
    0x405030,
    1.15
);

scene.add(ambient);

function createSky() {
    const skyGeometry = new THREE.SphereGeometry(
        450,
        24,
        16
    );

    const skyMaterial = new THREE.MeshBasicMaterial({
        color: 0x87ceeb,
        side: THREE.BackSide
    });

    const sky = new THREE.Mesh(
        skyGeometry,
        skyMaterial
    );

    scene.add(sky);

    return sky;
}

const sky = createSky();

function createTerrainChunk(cx, cz) {
    const key = cx + "," + cz;

    if (terrainChunks.has(key)) {
        return;
    }

    const geometry = new THREE.PlaneGeometry(
        CHUNK_SIZE,
        CHUNK_SIZE,
        TERRAIN_SEGMENTS,
        TERRAIN_SEGMENTS
    );

    const positions = geometry.attributes.position;

    const startX = cx * CHUNK_SIZE;
    const startZ = cz * CHUNK_SIZE;

    for (let i = 0; i < positions.count; i++) {
        const localX = positions.getX(i);
        const localZ = positions.getY(i);

        const worldX = startX + localX;
        const worldZ = startZ + localZ;

        positions.setZ(
            i,
            terrainHeight(worldX, worldZ)
        );
    }

    geometry.rotateX(-Math.PI / 2);
    geometry.computeVertexNormals();

    const material = biomeMaterials[
        biomeAt(
            startX + CHUNK_SIZE * 0.5,
            startZ + CHUNK_SIZE * 0.5
        )
    ];

    const mesh = new THREE.Mesh(
        geometry,
        material
    );

    mesh.position.set(
        startX + CHUNK_SIZE * 0.5,
        0,
        startZ + CHUNK_SIZE * 0.5
    );

    mesh.receiveShadow = false;

    scene.add(mesh);

    const objects = createChunkObjects(cx, cz);

    terrainChunks.set(key, {
        terrain: mesh,
        objects: objects
    });
}

function createTree() {
    const group = new THREE.Group();

    const trunkGeometry = new THREE.CylinderGeometry(
        0.16,
        0.23,
        2.8,
        6
    );

    const trunkMaterial = new THREE.MeshLambertMaterial({
        color: 0x63402b
    });

    const trunk = new THREE.Mesh(
        trunkGeometry,
        trunkMaterial
    );

    trunk.position.y = 1.4;

    group.add(trunk);

    const leavesGeometry = new THREE.ConeGeometry(
        1.25,
        3.0,
        7
    );

    const leavesMaterial = new THREE.MeshLambertMaterial({
        color: 0x315f35
    });

    const leaves = new THREE.Mesh(
        leavesGeometry,
        leavesMaterial
    );

    leaves.position.y = 3.35;

    group.add(leaves);

    return group;
}

function createBush() {
    const geometry = new THREE.SphereGeometry(
        0.65,
        7,
        5
    );

    const material = new THREE.MeshLambertMaterial({
        color: 0x3e7035
    });

    return new THREE.Mesh(
        geometry,
        material
    );
}

function createRock() {
    const geometry = new THREE.DodecahedronGeometry(
        0.7,
        0
    );

    const material = new THREE.MeshLambertMaterial({
        color: 0x777777
    });

    const rock = new THREE.Mesh(
        geometry,
        material
    );

    rock.scale.set(
        1.2,
        0.7,
        0.9
    );

    return rock;
}

function createGrass() {
    const group = new THREE.Group();

    const material = new THREE.MeshLambertMaterial({
        color: 0x4f873e,
        side: THREE.DoubleSide
    });

    for (let i = 0; i < 3; i++) {
        const geometry = new THREE.PlaneGeometry(
            0.08,
            0.65
        );

        const blade = new THREE.Mesh(
            geometry,
            material
        );

        blade.position.x =
            (i - 1) * 0.08;

        blade.position.y = 0.325;

        blade.rotation.y =
            i * Math.PI / 3;

        group.add(blade);
    }

    return group;
}

function createFlower() {
    const group = new THREE.Group();

    const stemGeometry = new THREE.CylinderGeometry(
        0.025,
        0.025,
        0.45,
        4
    );

    const stemMaterial = new THREE.MeshLambertMaterial({
        color: 0x3d7838
    });

    const stem = new THREE.Mesh(
        stemGeometry,
        stemMaterial
    );

    stem.position.y = 0.225;

    group.add(stem);

    const flowerGeometry = new THREE.SphereGeometry(
        0.13,
        6,
        5
    );

    const flowerMaterial = new THREE.MeshLambertMaterial({
        color: 0xe6b8d5
    });

    const flower = new THREE.Mesh(
        flowerGeometry,
        flowerMaterial
    );

    flower.position.y = 0.5;

    group.add(flower);

    return group;
}

function surfaceNormal(x, z) {
    const d = 0.5;

    const hL = terrainHeight(x - d, z);
    const hR = terrainHeight(x + d, z);
    const hD = terrainHeight(x, z - d);
    const hU = terrainHeight(x, z + d);

    const normal = new THREE.Vector3(
        hL - hR,
        2 * d,
        hD - hU
    );

    normal.normalize();

    return normal;
}

function placeObject(object, x, z) {
    const y = terrainHeight(x, z);

    object.position.set(
        x,
        y + 0.015,
        z
    );

    const normal = surfaceNormal(x, z);

    object.quaternion.setFromUnitVectors(
        UP,
        normal
    );

    return object;
}

function createChunkObjects(cx, cz) {
    const group = new THREE.Group();

    const startX = cx * CHUNK_SIZE;
    const startZ = cz * CHUNK_SIZE;

    const samples = 75;

    for (let i = 0; i < samples; i++) {
        const rx = hash(cx * 1000 + i, cz * 2000 + i);
        const rz = hash(cx * 3000 + i, cz * 4000 + i);

        const x =
            startX +
            rx * CHUNK_SIZE;

        const z =
            startZ +
            rz * CHUNK_SIZE;

        const biome = biomeAt(x, z);

        if (
            biome === "water" ||
            biome === "beach" ||
            biome === "mountain"
        ) {
            continue;
        }

        const chance = hash(
            cx * 5000 + i,
            cz * 6000 + i
        );

        let object = null;

        if (biome === "forest") {
            if (chance < 0.32) {
                object = createTree();
                object.scale.setScalar(
                    0.75 + chance * 1.1
                );
            } else if (chance < 0.58) {
                object = createBush();
            } else if (chance < 0.86) {
                object = createGrass();
            } else {
                object = createFlower();
            }
        }

        if (biome === "grassland") {
            if (chance < 0.58) {
                object = createGrass();
            } else if (chance < 0.72) {
                object = createFlower();
            } else if (chance < 0.84) {
                object = createBush();
            }
        }

        if (biome === "plains") {
            if (chance < 0.35) {
                object = createGrass();
            } else if (chance < 0.43) {
                object = createFlower();
            }
        }

        if (biome === "dryland") {
            if (chance < 0.18) {
                object = createBush();
            } else if (chance < 0.28) {
                object = createRock();
            }
        }

        if (biome === "desert") {
            if (chance < 0.14) {
                object = createRock();
            }
        }

        if (biome === "rock") {
            if (chance < 0.55) {
                object = createRock();
            }
        }

        if (object) {
            placeObject(
                object,
                x,
                z
            );

            group.add(object);
        }
    }

    scene.add(group);

    return group;
}

function updateChunks() {
    const centerX = Math.floor(
        playerX / CHUNK_SIZE
    );

    const centerZ = Math.floor(
        playerZ / CHUNK_SIZE
    );

    for (
        let x = centerX - VIEW_DISTANCE;
        x <= centerX + VIEW_DISTANCE;
        x++
    ) {
        for (
            let z = centerZ - VIEW_DISTANCE;
            z <= centerZ + VIEW_DISTANCE;
            z++
        ) {
            createTerrainChunk(x, z);
        }
    }
}

function getMovementInput() {
    let x = 0;
    let z = 0;

    if (keys.a) x -= 1;
    if (keys.d) x += 1;
    if (keys.w) z -= 1;
    if (keys.s) z += 1;

    if (joystick.active) {
        x += joystick.x;
        z += joystick.y;
    }

    const length = Math.hypot(x, z);

    if (length > 1) {
        x /= length;
        z /= length;
    }

    return {
        x: x,
        z: z
    };
}

function updatePlayer(dt) {
    const input = getMovementInput();

    const speed =
        sprinting ||
        keys.shift
            ? SPRINT_SPEED
            : WALK_SPEED;

    const sinYaw = Math.sin(yaw);
    const cosYaw = Math.cos(yaw);

    const moveX =
        input.x * cosYaw -
        input.z * sinYaw;

    const moveZ =
        input.x * sinYaw +
        input.z * cosYaw;

    playerX += moveX * speed * dt;
    playerZ += moveZ * speed * dt;

    const ground =
        terrainHeight(
            playerX,
            playerZ
        );

    const targetY =
        ground + PLAYER_HEIGHT;

    velocityY -= GRAVITY * dt;

    playerY += velocityY * dt;

    if (playerY <= targetY) {
        playerY = targetY;
        velocityY = 0;
        grounded = true;
    } else {
        grounded = false;
    }

    camera.position.set(
        playerX,
        playerY,
        playerZ
    );

    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
}

function jump() {
    if (!grounded) {
        return;
    }

    velocityY = JUMP_POWER;
    grounded = false;
}

function updateEnvironment(dt) {
    worldTime += dt / 20;

    if (worldTime >= 24) {
        worldTime -= 24;
    }

    const angle =
        (worldTime / 24) *
        Math.PI * 2;

    const sunX =
        Math.cos(angle) * 180;

    const sunY =
        Math.sin(angle) * 180;

    const sunZ = 80;

    sun.position.set(
        sunX,
        sunY,
        sunZ
    );

    const daylight =
        Math.max(
            0,
            Math.sin(angle)
        );

    sun.intensity =
        0.15 +
        daylight * 1.2;

    ambient.intensity =
        0.35 +
        daylight * 0.8;

    const skyValue =
        Math.floor(
            60 +
            daylight * 100
        );

    sky.material.color.setRGB(
        skyValue / 255,
        (110 + daylight * 100) / 255,
        (150 + daylight * 105) / 255
    );
}

window.addEventListener("keydown", function(e) {
    const key = e.key.toLowerCase();

    if (key === "w") keys.w = true;
    if (key === "a") keys.a = true;
    if (key === "s") keys.s = true;
    if (key === "d") keys.d = true;
    if (key === "shift") keys.shift = true;

    if (e.code === "Space") {
        if (!keys.space) {
            jump();
        }

        keys.space = true;
    }
});

window.addEventListener("keyup", function(e) {
    const key = e.key.toLowerCase();

    if (key === "w") keys.w = false;
    if (key === "a") keys.a = false;
    if (key === "s") keys.s = false;
    if (key === "d") keys.d = false;
    if (key === "shift") keys.shift = false;

    if (e.code === "Space") {
        keys.space = false;
    }
});

const stickElement =
    document.getElementById("stick");

const joystickElement =
    document.getElementById("joystick");

function updateJoystick(clientX, clientY) {
    const rect =
        joystickElement.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    let dx = clientX - centerX;
    let dy = clientY - centerY;

    const radius =
        rect.width * 0.36;

    const distance =
        Math.hypot(dx, dy);

    if (distance > radius) {
        dx =
            dx / distance * radius;

        dy =
            dy / distance * radius;
    }

    joystick.x = dx / radius;
    joystick.y = dy / radius;

    stickElement.style.left =
        "calc(50% + " +
        dx +
        "px)";

    stickElement.style.top =
        "calc(50% + " +
        dy +
        "px)";
}

function resetJoystick() {
    joystick.x = 0;
    joystick.y = 0;
    joystick.active = false;
    joystick.pointerId = null;

    stickElement.style.left = "50%";
    stickElement.style.top = "50%";
}

joystickElement.addEventListener(
    "pointerdown",
    function(e) {
        e.preventDefault();

        joystick.active = true;
        joystick.pointerId = e.pointerId;

        joystickElement.setPointerCapture(
            e.pointerId
        );

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystickElement.addEventListener(
    "pointermove",
    function(e) {
        if (
            !joystick.active ||
            e.pointerId !== joystick.pointerId
        ) {
            return;
        }

        updateJoystick(
            e.clientX,
            e.clientY
        );
    }
);

joystickElement.addEventListener(
    "pointerup",
    function() {
        resetJoystick();
    }
);

joystickElement.addEventListener(
    "pointercancel",
    function() {
        resetJoystick();
    }
);

const jumpButton =
    document.getElementById("jump");

jumpButton.addEventListener(
    "pointerdown",
    function(e) {
        e.preventDefault();
        jump();
    }
);

const sprintButton =
    document.getElementById("sprint");

sprintButton.addEventListener(
    "pointerdown",
    function(e) {
        e.preventDefault();
        sprinting = true;
    }
);

sprintButton.addEventListener(
    "pointerup",
    function() {
        sprinting = false;
    }
);

sprintButton.addEventListener(
    "pointercancel",
    function() {
        sprinting = false;
    }
);

sprintButton.addEventListener(
    "pointerleave",
    function() {
        sprinting = false;
    }
);

let lookPointer = null;
let lastLookX = 0;
let lastLookY = 0;

canvas.addEventListener(
    "pointerdown",
    function(e) {
        if (e.pointerType === "mouse") {
            lookPointer = e.pointerId;
            lastLookX = e.clientX;
            lastLookY = e.clientY;

            canvas.setPointerCapture(
                e.pointerId
            );
        }

        if (e.pointerType === "touch") {
            lookPointer = e.pointerId;
            lastLookX = e.clientX;
            lastLookY = e.clientY;

            canvas.setPointerCapture(
                e.pointerId
            );
        }
    }
);

canvas.addEventListener(
    "pointermove",
    function(e) {
        if (
            e.pointerId !== lookPointer
        ) {
            return;
        }

        const dx =
            e.clientX - lastLookX;

        const dy =
            e.clientY - lastLookY;

        lastLookX = e.clientX;
        lastLookY = e.clientY;

        yaw -= dx * 0.004;
        pitch -= dy * 0.004;

        pitch = Math.max(
            -Math.PI / 2 + 0.05,
            Math.min(
                Math.PI / 2 - 0.05,
                pitch
            )
        );
    }
);

canvas.addEventListener(
    "pointerup",
    function(e) {
        if (e.pointerId === lookPointer) {
            lookPointer = null;
        }
    }
);

canvas.addEventListener(
    "pointercancel",
    function(e) {
        if (e.pointerId === lookPointer) {
            lookPointer = null;
        }
    }
);

document.addEventListener(
    "visibilitychange",
    function() {
        if (document.hidden) {
            resetJoystick();
            sprinting = false;
        }
    }
);

window.addEventListener(
    "resize",
    function() {
        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                1.5
            )
        );
    }
);

updateChunks();

playerY =
    terrainHeight(
        playerX,
        playerZ
    ) + PLAYER_HEIGHT;

camera.position.set(
    playerX,
    playerY,
    playerZ
);

function animate() {
    requestAnimationFrame(animate);

    const dt =
        Math.min(
            clock.getDelta(),
            0.05
        );

    updatePlayer(dt);
    updateChunks();
    updateEnvironment(dt);

    renderer.render(
        scene,
        camera
    );
}

animate();
</script>

</body>
</html>
