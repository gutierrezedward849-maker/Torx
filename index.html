<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Detector</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    #camera {
        position: fixed;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    #overlay {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    #status {
        position: fixed;
        top: 15px;
        left: 15px;
        padding: 8px 12px;
        background: rgba(0,0,0,.65);
        color: white;
        font-family: monospace;
        border-radius: 6px;
        z-index: 5;
    }
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>
<canvas id="overlay"></canvas>

<div id="status">Starting camera...</div>

<script>
const video = document.getElementById("camera");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const status = document.getElementById("status");

const scanCanvas = document.createElement("canvas");
const scanCtx = scanCanvas.getContext("2d", {
    willReadFrequently: true
});

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            },
            audio: false
        });

        video.srcObject = stream;

        video.addEventListener("loadedmetadata", () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            scanCanvas.width = 320;
            scanCanvas.height =
                Math.round(320 * video.videoHeight / video.videoWidth);

            status.textContent = "GREEN DETECTOR ACTIVE";

            requestAnimationFrame(detect);
        });

    } catch (error) {
        status.textContent = "Camera access failed";
        console.error(error);
    }
}

function detect() {
    if (video.readyState < 2) {
        requestAnimationFrame(detect);
        return;
    }

    const w = scanCanvas.width;
    const h = scanCanvas.height;

    scanCtx.drawImage(video, 0, 0, w, h);

    const image = scanCtx.getImageData(0, 0, w, h);
    const data = image.data;

    let minX = w;
    let minY = h;
    let maxX = 0;
    let maxY = 0;

    let greenPixels = 0;

    /*
        Detect green.

        Increase/decrease these values
        to change sensitivity.
    */

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {

            const i = (y * w + x) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            const isGreen =
                g > 70 &&
                g > r * 1.25 &&
                g > b * 1.15;

            if (isGreen) {
                greenPixels++;

                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
        }
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    /*
        Ignore tiny green regions.
    */

    if (greenPixels > 100) {

        const scaleX = canvas.width / w;
        const scaleY = canvas.height / h;

        const x = minX * scaleX;
        const y = minY * scaleY;
        const width = (maxX - minX) * scaleX;
        const height = (maxY - minY) * scaleY;

        ctx.strokeStyle = "#00ff00";
        ctx.lineWidth = 5;

        ctx.strokeRect(
            x,
            y,
            width,
            height
        );

        /*
            Center marker
        */

        const cx = x + width / 2;
        const cy = y + height / 2;

        ctx.beginPath();

        ctx.moveTo(cx - 15, cy);
        ctx.lineTo(cx + 15, cy);

        ctx.moveTo(cx, cy - 15);
        ctx.lineTo(cx, cy + 15);

        ctx.stroke();

        status.textContent =
            "GREEN DETECTED: " + greenPixels + " pixels";

    } else {
        status.textContent = "Searching for green...";
    }

    requestAnimationFrame(detect);
}

startCamera();
</script>

</body>
</html>
