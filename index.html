<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>UNMAPPED</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#151b2b;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:block;
}

#status{
    position:fixed;
    left:50%;
    top:18px;
    transform:translateX(-50%);
    padding:8px 14px;
    border-radius:8px;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:13px;
    z-index:20;
    pointer-events:none;
}

#mobile{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:28px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.28);
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:40px;
    top:40px;
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(255,255,255,.38);
    border:2px solid rgba(255,255,255,.55);
}

.button{
    position:absolute;
    border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.15);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    user-select:none;
    pointer-events:auto;
    font-weight:bold;
    text-shadow:0 2px 4px #000;
}

#jump{
    right:28px;
    bottom:105px;
    width:78px;
    height:78px;
}

#run{
    right:120px;
    bottom:35px;
    width:64px;
    height:64px;
    font-size:12px;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:8px;
    height:8px;
    margin-left:-4px;
    margin-top:-4px;
    z-index:5;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.85);
}

#crosshair:before{
    left:3px;
    top:0;
    width:2px;
    height:8px;
}

#crosshair:after{
    left:0;
    top:3px;
    width:8px;
    height:2px;
}

@media (min-width:900px){
    #mobile{
        display:none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="status">STARTING WORLD...</div>
<div id="crosshair"></div>

<div id="mobile">
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="jump" class="button">JUMP</div>
    <div id="run" class="button">RUN</div>
</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const status=document.getElementById("status");

let gl;
let program;

let positionBuffer;
let colorBuffer;
let indexBuffer;

let aPosition;
let aColor;
let uProjection;
let uView;
let uLight;

let projection=new Float32Array(16);
let view=new Float32Array(16);

const WORLD={
    chunkSize:100,
    grid:16,
    renderRadius:2,
    chunks:new Map()
};

const player={
    x:0,
    y:12,
    z:20,
    vy:0,
    yaw:0,
    pitch:-0.08,
    height:1.8,
    radius:.35,
    grounded:false
};

const keys={};

let joystickX=0;
let joystickY=0;
let running=false;

let lastTime=performance.now();
let worldTime=0;

let cameraTouchId=null;
let lastTouchX=0;
let lastTouchY=0;

function fail(message){
    status.style.display="block";
    status.style.background="rgba(120,0,0,.9)";
    status.textContent="ERROR: "+message;
}

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
    return a+(b-a)*t;
}

function smooth(t){
    return t*t*(3-2*t);
}

function hash2(x,z){
    let n=Math.sin(x*127.1+z*311.7)*43758.5453123;
    return n-Math.floor(n);
}

function noise(x,z){
    const x0=Math.floor(x);
    const z0=Math.floor(z);
    const fx=x-x0;
    const fz=z-z0;

    const a=hash2(x0,z0);
    const b=hash2(x0+1,z0);
    const c=hash2(x0,z0+1);
    const d=hash2(x0+1,z0+1);

    const sx=smooth(fx);
    const sz=smooth(fz);

    return lerp(
        lerp(a,b,sx),
        lerp(c,d,sx),
        sz
    );
}

function fbm(x,z){
    let value=0;
    let amplitude=.5;
    let frequency=.008;

    for(let i=0;i<5;i++){
        value+=noise(x*frequency,z*frequency)*amplitude;
        frequency*=2;
        amplitude*=.5;
    }

    return value;
}

function biomeAt(x,z){
    const large=fbm(x+3000,z-2000);
    const medium=fbm(x-5000,z+4000);

    if(large<.27){
        return "water";
    }

    if(large<.39){
        return "sand";
    }

    if(medium>.67){
        return "rock";
    }

    if(medium<.30){
        return "forest";
    }

    return "grass";
}

function heightAt(x,z){
    const b=biomeAt(x,z);

    const broad=fbm(x+900,z-700);
    const detail=fbm(x*1.7-200,z*1.7+500);

    let h=0;

    if(b==="water"){
        h=-1.2;
    }else if(b==="sand"){
        h=-.35+detail*.4;
    }else if(b==="rock"){
        h=4+broad*8+detail*3;
    }else if(b==="forest"){
        h=1+broad*4+detail*1.8;
    }else{
        h=.7+broad*3+detail*1.2;
    }

    return h;
}

function terrainColor(b){
    if(b==="water"){
        return [.08,.25,.48];
    }

    if(b==="sand"){
        return [.68,.58,.36];
    }

    if(b==="rock"){
        return [.34,.36,.38];
    }

    if(b==="forest"){
        return [.10,.32,.12];
    }

    return [.25,.48,.16];
}

function createShader(type,source){
    const shader=gl.createShader(type);

    gl.shaderSource(shader,source);
    gl.compileShader(shader);

    if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){
        throw new Error(gl.getShaderInfoLog(shader));
    }

    return shader;
}

function createProgram(){
    const vertexSource=`
        attribute vec3 aPosition;
        attribute vec3 aColor;

        uniform mat4 uProjection;
        uniform mat4 uView;

        varying vec3 vColor;

        void main(){
            vColor=aColor;
            gl_Position=uProjection*uView*vec4(aPosition,1.0);
        }
    `;

    const fragmentSource=`
        precision mediump float;

        uniform float uLight;

        varying vec3 vColor;

        void main(){
            float brightness=max(uLight,.28);
            gl_FragColor=vec4(vColor*brightness,1.0);
        }
    `;

    const vs=createShader(gl.VERTEX_SHADER,vertexSource);
    const fs=createShader(gl.FRAGMENT_SHADER,fragmentSource);

    program=gl.createProgram();

    gl.attachShader(program,vs);
    gl.attachShader(program,fs);

    gl.linkProgram(program);

    if(!gl.getProgramParameter(program,gl.LINK_STATUS)){
        throw new Error(gl.getProgramInfoLog(program));
    }

    gl.useProgram(program);

    aPosition=gl.getAttribLocation(program,"aPosition");
    aColor=gl.getAttribLocation(program,"aColor");

    uProjection=gl.getUniformLocation(program,"uProjection");
    uView=gl.getUniformLocation(program,"uView");
    uLight=gl.getUniformLocation(program,"uLight");
}

function perspective(out,fovy,aspect,near,far){
    const f=1/Math.tan(fovy/2);
    const nf=1/(near-far);

    out[0]=f/aspect;
    out[1]=0;
    out[2]=0;
    out[3]=0;

    out[4]=0;
    out[5]=f;
    out[6]=0;
    out[7]=0;

    out[8]=0;
    out[9]=0;
    out[10]=(far+near)*nf;
    out[11]=-1;

    out[12]=0;
    out[13]=0;
    out[14]=(2*far*near)*nf;
    out[15]=0;
}

function normalize(x,y,z){
    const l=Math.hypot(x,y,z)||1;
    return [x/l,y/l,z/l];
}

function cross(a,b){
    return [
        a[1]*b[2]-a[2]*b[1],
        a[2]*b[0]-a[0]*b[2],
        a[0]*b[1]-a[1]*b[0]
    ];
}

function dot(a,b){
    return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
}

function lookAt(out,eye,center,up){
    const z=normalize(
        eye[0]-center[0],
        eye[1]-center[1],
        eye[2]-center[2]
    );

    const x=normalize(
        ...cross(up,z)
    );

    const y=cross(z,x);

    out[0]=x[0];
    out[1]=y[0];
    out[2]=z[0];
    out[3]=0;

    out[4]=x[1];
    out[5]=y[1];
    out[6]=z[1];
    out[7]=0;

    out[8]=x[2];
    out[9]=y[2];
    out[10]=z[2];
    out[11]=0;

    out[12]=-dot(x,eye);
    out[13]=-dot(y,eye);
    out[14]=-dot(z,eye);
    out[15]=1;
}

function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);

    const w=Math.max(1,Math.floor(innerWidth*dpr));
    const h=Math.max(1,Math.floor(innerHeight*dpr));

    if(canvas.width!==w||canvas.height!==h){
        canvas.width=w;
        canvas.height=h;
    }

    canvas.style.width=innerWidth+"px";
    canvas.style.height=innerHeight+"px";

    gl.viewport(0,0,canvas.width,canvas.height);

    perspective(
        projection,
        Math.PI/3,
        canvas.width/canvas.height,
        .05,
        1200
    );
}

function chunkKey(cx,cz){
    return cx+","+cz;
}

function generateChunk(cx,cz){
    const key=chunkKey(cx,cz);

    if(WORLD.chunks.has(key)){
        return WORLD.chunks.get(key);
    }

    const N=12;
    const step=WORLD.chunkSize/N;

    const positions=[];
    const colors=[];
    const indices=[];

    for(let z=0;z<=N;z++){
        for(let x=0;x<=N;x++){

            const wx=cx*WORLD.chunkSize+x*step;
            const wz=cz*WORLD.chunkSize+z*step;

            const h=heightAt(wx,wz);
            const b=biomeAt(wx,wz);

            const c=terrainColor(b);

            positions.push(wx,h,wz);
            colors.push(c[0],c[1],c[2]);
        }
    }

    for(let z=0;z<N;z++){
        for(let x=0;x<N;x++){

            const a=z*(N+1)+x;
            const b=a+1;
            const c=a+(N+1);
            const d=c+1;

            indices.push(a,c,b);
            indices.push(b,c,d);
        }
    }

    const chunk={
        positions:new Float32Array(positions),
        colors:new Float32Array(colors),
        indices:new Uint16Array(indices)
    };

    WORLD.chunks.set(key,chunk);

    return chunk;
}

function buildVegetation(){
    const data=[];

    const radius=220;
    const spacing=12;

    for(let x=-radius;x<=radius;x+=spacing){
        for(let z=-radius;z<=radius;z+=spacing){

            const r=hash2(x*3.7,z*8.1);

            if(r<.72){
                continue;
            }

            const wx=x+(hash2(x+17,z+91)-.5)*8;
            const wz=z+(hash2(x+41,z+13)-.5)*8;

            const b=biomeAt(wx,wz);

            if(b==="forest"&&r>.76){
                data.push({
                    type:"tree",
                    x:wx,
                    z:wz,
                    y:heightAt(wx,wz)
                });
            }else if(b==="grass"&&r>.94){
                data.push({
                    type:"flower",
                    x:wx,
                    z:wz,
                    y:heightAt(wx,wz)
                });
            }else if(b==="rock"&&r>.91){
                data.push({
                    type:"rock",
                    x:wx,
                    z:wz,
                    y:heightAt(wx,wz)
                });
            }
        }
    }

    return data;
}

let vegetation=[];

function addCube(vertices,colors,indices,x,y,z,sx,sy,sz,color){
    const base=vertices.length/3;

    const x0=x-sx;
    const x1=x+sx;
    const y0=y;
    const y1=y+sy;
    const z0=z-sz;
    const z1=z+sz;

    vertices.push(
        x0,y0,z0,
        x1,y0,z0,
        x1,y1,z0,
        x0,y1,z0,

        x0,y0,z1,
        x1,y0,z1,
        x1,y1,z1,
        x0,y1,z1
    );

    for(let i=0;i<8;i++){
        colors.push(color[0],color[1],color[2]);
    }

    indices.push(
        base,base+1,base+2,
        base,base+2,base+3,

        base+4,base+6,base+5,
        base+4,base+7,base+6,

        base,base+4,base+5,
        base,base+5,base+1,

        base+3,base+2,base+6,
        base+3,base+6,base+7,

        base+1,base+5,base+6,
        base+1,base+6,base+2,

        base,base+3,base+7,
        base,base+7,base+4
    );
}

function buildObjectMesh(){
    const vertices=[];
    const colors=[];
    const indices=[];

    for(const o of vegetation){

        if(o.type==="tree"){

            addCube(
                vertices,
                colors,
                indices,
                o.x,
                o.y,
                o.z,
                .45,
                5,
                .45,
                [.25,.12,.045]
            );

            addCube(
                vertices,
                colors,
                indices,
                o.x,
                o.y+4,
                o.z,
                2.4,
                2.4,
                2.4,
                [.08,.28,.09]
            );

        }else if(o.type==="rock"){

            addCube(
                vertices,
                colors,
                indices,
                o.x,
                o.y,
                o.z,
                1.2,
                1.4,
                1.1,
                [.35,.37,.38]
            );

        }else if(o.type==="flower"){

            addCube(
                vertices,
                colors,
                indices,
                o.x,
                o.y,
                o.z,
                .08,
                .7,
                .08,
                [.15,.35,.08]
            );

            addCube(
                vertices,
                colors,
                indices,
                o.x,
                o.y+.7,
                o.z,
                .22,
                .22,
                .22,
                [.8,.55,.12]
            );
        }
    }

    return {
        positions:new Float32Array(vertices),
        colors:new Float32Array(colors),
        indices:new Uint16Array(indices)
    };
}

let objectMesh=null;

function refreshChunks(){
    const cx=Math.floor(player.x/WORLD.chunkSize);
    const cz=Math.floor(player.z/WORLD.chunkSize);

    for(let z=-WORLD.renderRadius;z<=WORLD.renderRadius;z++){
        for(let x=-WORLD.renderRadius;x<=WORLD.renderRadius;x++){
            generateChunk(cx+x,cz+z);
        }
    }
}

function updateCamera(){
    const cp=Math.cos(player.pitch);
    const sp=Math.sin(player.pitch);

    const forward=[
        -Math.sin(player.yaw)*cp,
        sp,
        -Math.cos(player.yaw)*cp
    ];

    const eye=[
        player.x,
        player.y,
        player.z
    ];

    const center=[
        eye[0]+forward[0],
        eye[1]+forward[1],
        eye[2]+forward[2]
    ];

    lookAt(
        view,
        eye,
        center,
        [0,1,0]
    );
}

function drawMesh(mesh){
    if(!mesh||mesh.indices.length===0){
        return;
    }

    gl.bindBuffer(gl.ARRAY_BUFFER,positionBuffer);
    gl.bufferData(
        gl.ARRAY_BUFFER,
        mesh.positions,
        gl.DYNAMIC_DRAW
    );

    gl.enableVertexAttribArray(aPosition);
    gl.vertexAttribPointer(
        aPosition,
        3,
        gl.FLOAT,
        false,
        0,
        0
    );

    gl.bindBuffer(gl.ARRAY_BUFFER,colorBuffer);
    gl.bufferData(
        gl.ARRAY_BUFFER,
        mesh.colors,
        gl.DYNAMIC_DRAW
    );

    gl.enableVertexAttribArray(aColor);
    gl.vertexAttribPointer(
        aColor,
        3,
        gl.FLOAT,
        false,
        0,
        0
    );

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuffer);
    gl.bufferData(
        gl.ELEMENT_ARRAY_BUFFER,
        mesh.indices,
        gl.DYNAMIC_DRAW
    );

    gl.drawElements(
        gl.TRIANGLES,
        mesh.indices.length,
        gl.UNSIGNED_SHORT,
        0
    );
}

function daylight(){
    const sun=Math.sin(worldTime*Math.PI*2);

    return clamp(
        .42+.58*Math.max(0,sun),
        .42,
        1
    );
}

function render(){
    const light=daylight();

    const skyR=lerp(.025,.38,light);
    const skyG=lerp(.045,.65,light);
    const skyB=lerp(.09,.95,light);

    gl.clearColor(
        skyR,
        skyG,
        skyB,
        1
    );

    gl.clear(
        gl.COLOR_BUFFER_BIT|
        gl.DEPTH_BUFFER_BIT
    );

    gl.useProgram(program);

    gl.uniformMatrix4fv(
        uProjection,
        false,
        projection
    );

    gl.uniformMatrix4fv(
        uView,
        false,
        view
    );

    gl.uniform1f(
        uLight,
        light
    );

    for(const chunk of WORLD.chunks.values()){
        drawMesh(chunk);
    }

    if(objectMesh){
        drawMesh(objectMesh);
    }
}

function move(dt){
    let ix=0;
    let iy=0;

    if(keys["KeyW"]) iy+=1;
    if(keys["KeyS"]) iy-=1;
    if(keys["KeyA"]) ix-=1;
    if(keys["KeyD"]) ix+=1;

    ix+=joystickX;
    iy+=joystickY;

    const length=Math.hypot(ix,iy);

    if(length>1){
        ix/=length;
        iy/=length;
    }

    const speed=running?13:6;

    const forwardX=-Math.sin(player.yaw);
    const forwardZ=-Math.cos(player.yaw);

    const rightX=Math.cos(player.yaw);
    const rightZ=-Math.sin(player.yaw);

    player.x+=(
        forwardX*iy+
        rightX*ix
    )*speed*dt;

    player.z+=(
        forwardZ*iy+
        rightZ*ix
    )*speed*dt;

    const ground=heightAt(player.x,player.z);

    if(player.y<=ground+player.height){
        player.y=ground+player.height;
        player.vy=0;
        player.grounded=true;
    }else{
        player.grounded=false;
    }

    player.vy-=22*dt;
    player.y+=player.vy*dt;

    if(player.y<ground+player.height){
        player.y=ground+player.height;
        player.vy=0;
        player.grounded=true;
    }
}

function jump(){
    if(player.grounded){
        player.vy=9;
        player.grounded=false;
    }
}

function setupControls(){
    window.addEventListener("keydown",e=>{
        keys[e.code]=true;

        if(e.code==="Space"){
            jump();
        }

        if(e.code==="ShiftLeft"||e.code==="ShiftRight"){
            running=true;
        }
    });

    window.addEventListener("keyup",e=>{
        keys[e.code]=false;

        if(e.code==="ShiftLeft"||e.code==="ShiftRight"){
            running=false;
        }
    });

    const joystick=document.getElementById("joystick");
    const stick=document.getElementById("stick");

    let joyId=null;

    function updateJoy(clientX,clientY){
        const r=joystick.getBoundingClientRect();

        const cx=r.left+r.width/2;
        const cy=r.top+r.height/2;

        let dx=clientX-cx;
        let dy=clientY-cy;

        const max=40;
        const len=Math.hypot(dx,dy);

        if(len>max){
            dx=dx/len*max;
            dy=dy/len*max;
        }

        joystickX=dx/max;
        joystickY=-dy/max;

        stick.style.transform=
            "translate("+dx+"px,"+dy+"px)";
    }

    joystick.addEventListener("touchstart",e=>{
        e.preventDefault();

        const t=e.changedTouches[0];
        joyId=t.identifier;

        updateJoy(t.clientX,t.clientY);
    },{passive:false});

    joystick.addEventListener("touchmove",e=>{
        e.preventDefault();

        for(const t of e.changedTouches){
            if(t.identifier===joyId){
                updateJoy(t.clientX,t.clientY);
            }
        }
    },{passive:false});

    function stopJoy(){
        joyId=null;
        joystickX=0;
        joystickY=0;
        stick.style.transform="translate(0px,0px)";
    }

    joystick.addEventListener("touchend",stopJoy);
    joystick.addEventListener("touchcancel",stopJoy);

    const jumpButton=document.getElementById("jump");

    jumpButton.addEventListener("touchstart",e=>{
        e.preventDefault();
        jump();
    },{passive:false});

    const runButton=document.getElementById("run");

    runButton.addEventListener("touchstart",e=>{
        e.preventDefault();
        running=true;
    },{passive:false});

    runButton.addEventListener("touchend",e=>{
        e.preventDefault();
        running=false;
    },{passive:false});

    canvas.addEventListener("touchstart",e=>{
        if(e.touches.length!==1){
            return;
        }

        const t=e.touches[0];

        if(
            t.clientX<180&&
            t.clientY>innerHeight-190
        ){
            return;
        }

        cameraTouchId=t.identifier;
        lastTouchX=t.clientX;
        lastTouchY=t.clientY;
    },{passive:false});

    canvas.addEventListener("touchmove",e=>{
        e.preventDefault();

        for(const t of e.changedTouches){

            if(t.identifier!==cameraTouchId){
                continue;
            }

            const dx=t.clientX-lastTouchX;
            const dy=t.clientY-lastTouchY;

            lastTouchX=t.clientX;
            lastTouchY=t.clientY;

            player.yaw-=dx*.006;
            player.pitch-=dy*.004;

            player.pitch=clamp(
                player.pitch,
                -1.45,
                1.45
            );
        }
    },{passive:false});

    canvas.addEventListener("touchend",e=>{
        for(const t of e.changedTouches){
            if(t.identifier===cameraTouchId){
                cameraTouchId=null;
            }
        }
    });

    canvas.addEventListener("touchcancel",e=>{
        cameraTouchId=null;
    });
}

function init(){
    try{

        gl=
            canvas.getContext("webgl",{
                alpha:false,
                antialias:false,
                depth:true,
                powerPreference:"high-performance"
            })||
            canvas.getContext("experimental-webgl");

        if(!gl){
            throw new Error("WebGL is unavailable on this browser");
        }

        createProgram();

        positionBuffer=gl.createBuffer();
        colorBuffer=gl.createBuffer();
        indexBuffer=gl.createBuffer();

        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);

        // Culling is intentionally disabled while the renderer is being validated.
        gl.disable(gl.CULL_FACE);

        gl.disable(gl.BLEND);

        resize();

        window.addEventListener("resize",resize);

        setupControls();

        refreshChunks();

        vegetation=buildVegetation();

        objectMesh=buildObjectMesh();

        player.y=heightAt(player.x,player.z)+player.height;

        updateCamera();

        status.textContent="WORLD READY";

        requestAnimationFrame(loop);

    }catch(error){
        fail(error.message||String(error));
        console.error(error);
    }
}

function loop(now){
    try{

        const dt=Math.min(
            (now-lastTime)/1000,
            .05
        );

        lastTime=now;

        worldTime+=dt/180;

        if(worldTime>1){
            worldTime-=1;
        }

        move(dt);

        refreshChunks();

        updateCamera();

        render();

        requestAnimationFrame(loop);

    }catch(error){
        fail(error.message||String(error));
        console.error(error);
    }
}

init();
</script>
