<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Camera Object Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
html,body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#video {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

#canvas {
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#status {
    position:fixed;
    top:15px;
    left:15px;
    z-index:10;

    background:rgba(0,0,0,.7);
    color:white;

    padding:10px;
    border-radius:8px;

    font-family:Arial;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div id="status">
Loading...
</div>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const status =
    document.getElementById("status");

let model;


/* =========================
   CAMERA
========================= */

async function startCamera() {

    const stream =
        await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode:"environment",
                width:{ideal:1280},
                height:{ideal:720}
            },

            audio:false
        });

    video.srcObject = stream;

    await video.play();

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;
}


/* =========================
   COLOR
========================= */

function getColor(x,y,w,h) {

    const temp =
        document.createElement("canvas");

    temp.width = 30;
    temp.height = 30;

    const t =
        temp.getContext("2d");

    t.drawImage(
        video,
        x,y,w,h,
        0,0,30,30
    );

    const data =
        t.getImageData(
            0,0,30,30
        ).data;

    let r=0;
    let g=0;
    let b=0;
    let count=0;

    for(let i=0;i<data.length;i+=4){

        const R=data[i];
        const G=data[i+1];
        const B=data[i+2];

        r+=R;
        g+=G;
        b+=B;

        count++;
    }

    r/=count;
    g/=count;
    b/=count;


    if(r<60 && g<60 && b<60)
        return "BLACK";

    if(r>190 && g>190 && b>190)
        return "WHITE";

    if(g>r*1.25 && g>b*1.15)
        return "GREEN";

    if(r>g*1.3 && r>b*1.3)
        return "RED";

    if(b>r*1.25 && b>g*1.1)
        return "BLUE";

    if(r>150 && g>120 && b<100)
        return "YELLOW";

    if(r>150 && g>70 && b<80)
        return "ORANGE";

    if(r>90 && b>90 && g<80)
        return "PURPLE";

    if(
        Math.abs(r-g)<25 &&
        Math.abs(g-b)<25
    )
        return "GRAY";

    return "MIXED";
}


/* =========================
   DETECTION
========================= */

async function detect() {

    const predictions =
        await model.detect(video);


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let found = 0;


    for(const p of predictions) {

        if(p.score < 0.45)
            continue;


        const [
            x,
            y,
            w,
            h
        ] = p.bbox;


        /*
        PERSON
        */

        if(p.class === "person") {

            found++;


            /*
            Person box
            */

            ctx.strokeStyle =
                "#00ff00";

            ctx.lineWidth = 4;

            ctx.strokeRect(
                x,y,w,h
            );


            /*
            Person label
            */

            const color =
                getColor(
                    x,
                    y + h*0.30,
                    w,
                    h*0.45
                );


            ctx.fillStyle =
                "rgba(0,0,0,.75)";

            ctx.fillRect(
                x,
                y-32,
                230,
                32
            );


            ctx.fillStyle =
                "#00ff00";

            ctx.font =
                "bold 17px Arial";

            ctx.fillText(
                "PERSON | CLOTHING: " +
                color,
                x+7,
                y-10
            );


            /*
            CLOTHING REGION

            Approximation:
            middle portion of person
            */

            const clothingX =
                x + w*0.15;

            const clothingY =
                y + h*0.25;

            const clothingW =
                w*0.70;

            const clothingH =
                h*0.45;


            ctx.strokeStyle =
                "#00ffff";

            ctx.lineWidth = 3;

            ctx.strokeRect(
                clothingX,
                clothingY,
                clothingW,
                clothingH
            );


            ctx.fillStyle =
                "#00ffff";

            ctx.font =
                "bold 15px Arial";

            ctx.fillText(
                color + " CLOTHING",
                clothingX,
                clothingY-7
            );
        }


        /*
        OTHER OBJECTS
        */

        else {

            ctx.strokeStyle =
                "#ffffff";

            ctx.lineWidth = 2;

            ctx.strokeRect(
                x,y,w,h
            );


            ctx.fillStyle =
                "white";

            ctx.font =
                "15px Arial";

            ctx.fillText(
                p.class +
                " " +
                Math.round(p.score*100) +
                "%",
                x,
                y-5
            );
        }
    }


    status.textContent =
        found +
        " person(s) detected";


    requestAnimationFrame(
        detect
    );
}


/* =========================
   START
========================= */

async function main() {

    try {

        status.textContent =
            "Starting camera...";

        await startCamera();


        status.textContent =
            "Loading AI model...";


        model =
            await cocoSsd.load();


        status.textContent =
            "SCANNING";


        detect();


    } catch(error) {

        console.error(error);

        status.textContent =
            "ERROR: " +
            error.message;
    }
}


main();

</script>

</body>
</html>
