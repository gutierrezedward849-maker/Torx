<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>UNMAPPED World</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#86ccef;
    touch-action:none;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    z-index:1;
    display:block;
    touch-action:none;
}

#mobile{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:22px;
    bottom:25px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(0,0,0,.18);
    border:2px solid rgba(255,255,255,.6);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:56px;
    height:56px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.55);
    border:2px solid rgba(255,255,255,.8);
}

.button{
    position:absolute;
    pointer-events:auto;
    width:82px;
    height:82px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.65);
    background:rgba(0,0,0,.32);
    color:white;
    font-weight:bold;
    font-size:13px;
    touch-action:none;
}

#jump{
    right:25px;
    bottom:35px;
}

#run{
    right:125px;
    bottom:42px;
    width:68px;
    height:68px;
}

#status{
    position:fixed;
    z-index:30;
    left:50%;
    top:15px;
    transform:translateX(-50%);
    padding:7px 12px;
    border-radius:8px;
    background:rgba(0,0,0,.35);
    color:white;
    font-size:12px;
    pointer-events:none;
}

#crosshair{
    position:fixed;
    z-index:10;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

#crosshair:before{
    content:"";
    position:absolute;
    left:4px;
    top:0;
    width:2px;
    height:10px;
    background:white;
}

#crosshair:after{
    content:"";
    position:absolute;
    left:0;
    top:4px;
    width:10px;
    height:2px;
    background:white;
}

@media(min-width:800px){
    #mobile{
        display:none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="crosshair"></div>

<div id="status">WORLD STARTING...</div>

<div id="mobile">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="run" class="button">
        RUN
    </button>

    <button id="jump" class="button">
        JUMP
    </button>

</div>

<script>
"use strict";

const canvas=document.getElementById("game");
const gl=canvas.getContext("webgl",{antialias:false});

const status=document.getElementById("status");

if(!gl){
    status.textContent="WebGL IS NOT AVAILABLE";
    throw new Error("WebGL unavailable");
}

const vertexSource=`
attribute vec3 aPosition;
attribute vec3 aColor;

uniform mat4 uProjection;
uniform mat4 uView;

varying vec3 vColor;

void main(){
    vColor=aColor;
    gl_Position=uProjection*uView*vec4(aPosition,1.0);
}
`;

const fragmentSource=`
precision mediump float;

varying vec3 vColor;

void main(){
    gl_FragColor=vec4(vColor,1.0);
}
`;

function shader(type,source){

    const s=gl.createShader(type);

    gl.shaderSource(s,source);

    gl.compileShader(s);

    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
        throw new Error(
            gl.getShaderInfoLog(s)
        );
    }

    return s;
}

const program=gl.createProgram();

gl.attachShader(
    program,
    shader(
        gl.VERTEX_SHADER,
        vertexSource
    )
);

gl.attachShader(
    program,
    shader(
        gl.FRAGMENT_SHADER,
        fragmentSource
    )
);

gl.linkProgram(program);

if(!gl.getProgramParameter(
    program,
    gl.LINK_STATUS
)){
    throw new Error(
        gl.getProgramInfoLog(program)
    );
}

gl.useProgram(program);

const aPosition=
    gl.getAttribLocation(
        program,
        "aPosition"
    );

const aColor=
    gl.getAttribLocation(
        program,
        "aColor"
    );

const uProjection=
    gl.getUniformLocation(
        program,
        "uProjection"
    );

const uView=
    gl.getUniformLocation(
        program,
        "uView"
    );

gl.enableVertexAttribArray(aPosition);
gl.enableVertexAttribArray(aColor);

gl.enable(gl.DEPTH_TEST);

gl.depthFunc(gl.LEQUAL);

gl.enable(gl.CULL_FACE);

const SEED=918273;

const CHUNK=48;

const GRID=20;

const VIEW=3;

const PLAYER_HEIGHT=1.8;

const WALK=5.5;

const RUN=9;

const JUMP=7.5;

const GRAVITY=21;

let px=0;

let pz=0;

let py=5;

let vy=0;

let grounded=false;

let yaw=0;

let pitch=0;

let running=false;

let worldTime=8;

let lastTime=performance.now();

const chunks=new Map();

const keys={
    w:false,
    a:false,
    s:false,
    d:false,
    shift:false
};

const joy={
    active:false,
    id:null,
    x:0,
    y:0
};

function hash(x,z){

    let n=
        Math.sin(
            x*127.1+
            z*311.7+
            SEED
        )*43758.5453;

    return n-Math.floor(n);
}

function smooth(x){
    return x*x*(3-2*x);
}

function noise(x,z,scale){

    const sx=x/scale;
    const sz=z/scale;

    const x0=Math.floor(sx);
    const z0=Math.floor(sz);

    const x1=x0+1;
    const z1=z0+1;

    const tx=smooth(sx-x0);
    const tz=smooth(sz-z0);

    const a=hash(x0,z0);
    const b=hash(x1,z0);
    const c=hash(x0,z1);
    const d=hash(x1,z1);

    const ab=a+(b-a)*tx;
    const cd=c+(d-c)*tx;

    return ab+(cd-ab)*tz;
}

function fbm(x,z,scale){

    let value=0;
    let amp=.5;
    let freq=1;
    let total=0;

    for(let i=0;i<4;i++){

        value+=
            noise(
                x,
                z,
                scale/freq
            )*amp;

        total+=amp;

        amp*=.5;
        freq*=2;
    }

    return value/total;
}

function height(x,z){

    const continent=
        fbm(
            x+1000,
            z-500,
            170
        );

    const hills=
        fbm(
            x-500,
            z+700,
            58
        );

    const detail=
        fbm(
            x+800,
            z+100,
            18
        );

    let h=
        (continent-.5)*7+
        (hills-.5)*8+
        (detail-.5)*1.5;

    const mountain=
        fbm(
            x-1900,
            z+1600,
            115
        );

    if(mountain>.67){
        h+=(mountain-.67)*55;
    }

    return h;
}

function moisture(x,z){

    return fbm(
        x+3000,
        z-4000,
        70
    );
}

function temperature(x,z){

    return fbm(
        x-5000,
        z+1000,
        90
    );
}

function biome(x,z){

    const h=height(x,z);
    const m=moisture(x,z);
    const t=temperature(x,z);

    if(h<-1.8){
        return 0;
    }

    if(h<-.2){
        return 1;
    }

    if(h>15){
        return 8;
    }

    if(h>8){
        return 7;
    }

    if(t>.73&&m<.34){
        return 6;
    }

    if(m>.68){
        return 5;
    }

    if(m>.52){
        return 4;
    }

    if(m<.3){
        return 3;
    }

    return 2;
}

const biomeColors=[
    [0.10,0.40,0.65],
    [0.72,0.63,0.39],
    [0.40,0.57,0.25],
    [0.55,0.46,0.25],
    [0.29,0.57,0.25],
    [0.20,0.40,0.20],
    [0.70,0.53,0.30],
    [0.40,0.40,0.40],
    [0.34,0.34,0.34]
];

function terrainNormal(x,z){

    const e=.4;

    const l=height(x-e,z);
    const r=height(x+e,z);
    const d=height(x,z-e);
    const u=height(x,z+e);

    let nx=l-r;
    let ny=e*2;
    let nz=d-u;

    const len=
        Math.sqrt(
            nx*nx+
            ny*ny+
            nz*nz
        );

    return [
        nx/len,
        ny/len,
        nz/len
    ];
}

function makeChunk(cx,cz){

    const key=cx+","+cz;

    if(chunks.has(key)){
        return;
    }

    const vertices=[];
    const colors=[];
    const indices=[];

    const size=GRID+1;

    for(let z=0;z<=GRID;z++){

        for(let x=0;x<=GRID;x++){

            const wx=
                cx*CHUNK+
                x/GRID*CHUNK;

            const wz=
                cz*CHUNK+
                z/GRID*CHUNK;

            const wy=
                height(
                    wx,
                    wz
                );

            vertices.push(
                wx,
                wy,
                wz
            );

            const b=
                biome(
                    wx,
                    wz
                );

            const c=
                biomeColors[b];

            colors.push(
                c[0],
                c[1],
                c[2]
            );
        }
    }

    for(let z=0;z<GRID;z++){

        for(let x=0;x<GRID;x++){

            const a=
                z*size+x;

            const b=a+1;

            const c=
                a+size;

            const d=c+1;

            indices.push(
                a,c,b,
                b,c,d
            );
        }
    }

    const positionBuffer=
        gl.createBuffer();

    gl.bindBuffer(
        gl.ARRAY_BUFFER,
        positionBuffer
    );

    gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array(vertices),
        gl.STATIC_DRAW
    );

    const colorBuffer=
        gl.createBuffer();

    gl.bindBuffer(
        gl.ARRAY_BUFFER,
        colorBuffer
    );

    gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array(colors),
        gl.STATIC_DRAW
    );

    const indexBuffer=
        gl.createBuffer();

    gl.bindBuffer(
        gl.ELEMENT_ARRAY_BUFFER,
        indexBuffer
    );

    gl.bufferData(
        gl.ELEMENT_ARRAY_BUFFER,
        new Uint32Array(indices),
        gl.STATIC_DRAW
    );

    chunks.set(
        key,
        {
            position:positionBuffer,
            color:colorBuffer,
            index:indexBuffer,
            count:indices.length
        }
    );
}

function updateChunks(){

    const cx=
        Math.floor(
            px/CHUNK
        );

    const cz=
        Math.floor(
            pz/CHUNK
        );

    for(
        let x=cx-VIEW;
        x<=cx+VIEW;
        x++
    ){

        for(
            let z=cz-VIEW;
            z<=cz+VIEW;
            z++
        ){

            makeChunk(
                x,
                z
            );
        }
    }
}

function matrixPerspective(
    fov,
    aspect,
    near,
    far
){

    const f=
        1/
        Math.tan(
            fov/2
        );

    const nf=
        1/
        (near-far);

    return new Float32Array([
        f/aspect,0,0,0,
        0,f,0,0,
        0,0,(far+near)*nf,-1,
        0,0,(2*far*near)*nf,0
    ]);
}

function matrixView(){

    const cy=Math.cos(yaw);
    const sy=Math.sin(yaw);

    const cp=Math.cos(pitch);
    const sp=Math.sin(pitch);

    const fx=-sy*cp;
    const fy=sp;
    const fz=-cy*cp;

    const rx=cy;
    const ry=0;
    const rz=-sy;

    const ux=
        ry*fz-
        rz*fy;

    const uy=
        rz*fx-
        rx*fz;

    const uz=
        rx*fy-
        ry*fx;

    const tx=
        -(rx*px+
        ry*py+
        rz*pz);

    const ty=
        -(ux*px+
        uy*py+
        uz*pz);

    const tz=
        -(
            -fx*px+
            -fy*py+
            -fz*pz
        );

    return new Float32Array([
        rx,ux,-fx,0,
        ry,uy,-fy,0,
        rz,uz,-fz,0,
        tx,ty,tz,1
    ]);
}

function draw(){

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const daylight=
        Math.max(
            0,
            Math.sin(
                worldTime/24*
                Math.PI*2
            )
        );

    gl.clearColor(
        .05+
        daylight*.25,
        .10+
        daylight*.42,
        .18+
        daylight*.65,
        1
    );

    gl.clear(
        gl.COLOR_BUFFER_BIT|
        gl.DEPTH_BUFFER_BIT
    );

    gl.useProgram(program);

    const projection=
        matrixPerspective(
            Math.PI/3,
            canvas.width/
            canvas.height,
            .1,
            900
        );

    const view=
        matrixView();

    gl.uniformMatrix4fv(
        uProjection,
        false,
        projection
    );

    gl.uniformMatrix4fv(
        uView,
        false,
        view
    );

    for(const chunk of chunks.values()){

        gl.bindBuffer(
            gl.ARRAY_BUFFER,
            chunk.position
        );

        gl.vertexAttribPointer(
            aPosition,
            3,
            gl.FLOAT,
            false,
            0,
            0
        );

        gl.bindBuffer(
            gl.ARRAY_BUFFER,
            chunk.color
        );

        gl.vertexAttribPointer(
            aColor,
            3,
            gl.FLOAT,
            false,
            0,
            0
        );

        gl.bindBuffer(
            gl.ELEMENT_ARRAY_BUFFER,
            chunk.index
        );

        gl.drawElements(
            gl.TRIANGLES,
            chunk.count,
            gl.UNSIGNED_INT,
            0
        );
    }
}

function input(){

    let x=0;
    let z=0;

    if(keys.w)z-=1;
    if(keys.s)z+=1;
    if(keys.a)x-=1;
    if(keys.d)x+=1;

    if(joy.active){

        x+=joy.x;
        z+=joy.y;
    }

    const len=
        Math.hypot(
            x,
            z
        );

    if(len>1){

        x/=len;
        z/=len;
    }

    return {
        x:x,
        z:z
    };
}

function update(dt){

    const move=input();

    const speed=
        running||
        keys.shift
        ?RUN
        :WALK;

    const forwardX=
        -Math.sin(yaw);

    const forwardZ=
        -Math.cos(yaw);

    const rightX=
        Math.cos(yaw);

    const rightZ=
        -Math.sin(yaw);

    px+=(
        forwardX*move.z+
        rightX*move.x
    )*speed*dt;

    pz+=(
        forwardZ*move.z+
        rightZ*move.x
    )*speed*dt;

    const ground=
        height(
            px,
            pz
        )+
        PLAYER_HEIGHT;

    vy-=
        GRAVITY*dt;

    py+=
        vy*dt;

    if(py<=ground){

        py=ground;

        vy=0;

        grounded=true;
    }
    else{

        grounded=false;
    }

    worldTime+=
        dt*.45;

    if(worldTime>=24){
        worldTime-=24;
    }

    updateChunks();
}

function jump(){

    if(!grounded){
        return;
    }

    vy=JUMP;

    grounded=false;
}

const joystickElement=
    document.getElementById(
        "joystick"
    );

const stickElement=
    document.getElementById(
        "stick"
    );

function joystickMove(x,y){

    const rect=
        joystickElement.getBoundingClientRect();

    const cx=
        rect.left+
        rect.width/2;

    const cy=
        rect.top+
        rect.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const radius=42;

    const distance=
        Math.hypot(
            dx,
            dy
        );

    if(distance>radius){

        dx=
            dx/distance*
            radius;

        dy=
            dy/distance*
            radius;
    }

    joy.x=
        dx/radius;

    joy.y=
        dy/radius;

    stickElement.style.left=
        "calc(50% + "+dx+"px)";

    stickElement.style.top=
        "calc(50% + "+dy+"px)";
}

function joystickReset(){

    joy.active=false;
    joy.id=null;
    joy.x=0;
    joy.y=0;

    stickElement.style.left="50%";
    stickElement.style.top="50%";
}

joystickElement.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        joy.active=true;
        joy.id=e.pointerId;

        joystickElement.setPointerCapture(
            e.pointerId
        );

        joystickMove(
            e.clientX,
            e.clientY
        );
    }
);

joystickElement.addEventListener(
    "pointermove",
    function(e){

        if(
            !joy.active||
            e.pointerId!==joy.id
        ){
            return;
        }

        joystickMove(
            e.clientX,
            e.clientY
        );
    }
);

joystickElement.addEventListener(
    "pointerup",
    joystickReset
);

joystickElement.addEventListener(
    "pointercancel",
    joystickReset
);

document.getElementById(
    "jump"
).addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();
    }
);

const runButton=
    document.getElementById(
        "run"
    );

runButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        running=true;
    }
);

runButton.addEventListener(
    "pointerup",
    function(){
        running=false;
    }
);

runButton.addEventListener(
    "pointercancel",
    function(){
        running=false;
    }
);

let lookId=null;

let lookX=0;

let lookY=0;

canvas.addEventListener(
    "pointerdown",
    function(e){

        lookId=e.pointerId;

        lookX=e.clientX;

        lookY=e.clientY;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    function(e){

        if(e.pointerId!==lookId){
            return;
        }

        const dx=
            e.clientX-lookX;

        const dy=
            e.clientY-lookY;

        lookX=e.clientX;
        lookY=e.clientY;

        yaw-=dx*.004;

        pitch-=dy*.004;

        pitch=
            Math.max(
                -1.45,
                Math.min(
                    1.45,
                    pitch
                )
            );
    }
);

canvas.addEventListener(
    "pointerup",
    function(e){

        if(e.pointerId===lookId){
            lookId=null;
        }
    }
);

window.addEventListener(
    "keydown",
    function(e){

        const k=
            e.key.toLowerCase();

        if(k==="w")keys.w=true;
        if(k==="a")keys.a=true;
        if(k==="s")keys.s=true;
        if(k==="d")keys.d=true;
        if(k==="shift")keys.shift=true;

        if(e.code==="Space"){
            jump();
        }
    }
);

window.addEventListener(
    "keyup",
    function(e){

        const k=
            e.key.toLowerCase();

        if(k==="w")keys.w=false;
        if(k==="a")keys.a=false;
        if(k==="s")keys.s=false;
        if(k==="d")keys.d=false;
        if(k==="shift")keys.shift=false;
    }
);

function resize(){

    const dpr=
        Math.min(
            window.devicePixelRatio||1,
            1.5
        );

    canvas.width=
        Math.floor(
            window.innerWidth*dpr
        );

    canvas.height=
        Math.floor(
            window.innerHeight*dpr
        );

    canvas.style.width=
        window.innerWidth+"px";

    canvas.style.height=
        window.innerHeight+"px";
}

window.addEventListener(
    "resize",
    resize
);

resize();

py=
    height(
        px,
        pz
    )+
    PLAYER_HEIGHT;

updateChunks();

status.textContent=
    "WORLD READY";

setTimeout(
    function(){
        status.style.display="none";
    },
    1800
);

function loop(now){

    const dt=
        Math.min(
            (now-lastTime)/1000,
            .05
        );

    lastTime=now;

    update(dt);

    draw();

    requestAnimationFrame(
        loop
    );
}

requestAnimationFrame(
    loop
);
</script>

</body>
</html>
