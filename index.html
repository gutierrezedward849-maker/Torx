<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Advanced Procedural World</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    z-index:1;
    touch-action:none;
}

#mobile{
    position:fixed;
    inset:0;
    z-index:100;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:22px;
    bottom:25px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    border:2px solid rgba(255,255,255,.55);
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:58px;
    height:58px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.55);
    border:2px solid rgba(255,255,255,.8);
}

.button{
    position:absolute;
    border:2px solid rgba(255,255,255,.6);
    background:rgba(0,0,0,.38);
    color:white;
    font-family:Arial,sans-serif;
    font-weight:bold;
    pointer-events:auto;
    touch-action:none;
    user-select:none;
}

#jump{
    right:25px;
    bottom:35px;
    width:85px;
    height:85px;
    border-radius:50%;
}

#sprint{
    right:125px;
    bottom:45px;
    width:70px;
    height:70px;
    border-radius:50%;
}

#crosshair{
    position:fixed;
    z-index:50;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

#crosshair:before{
    content:"";
    position:absolute;
    left:4px;
    top:0;
    width:2px;
    height:10px;
    background:white;
}

#crosshair:after{
    content:"";
    position:absolute;
    left:0;
    top:4px;
    width:10px;
    height:2px;
    background:white;
}

@media(min-width:800px){
    #mobile{
        display:none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="crosshair"></div>

<div id="mobile">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="sprint" class="button">
        RUN
    </button>

    <button id="jump" class="button">
        JUMP
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const canvas=document.getElementById("game");

const renderer=new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
    72,
    window.innerWidth/window.innerHeight,
    .1,
    1200
);

camera.rotation.order="YXZ";

const clock=new THREE.Clock();

const SEED=481739;

const CHUNK_SIZE=64;

const CHUNK_RESOLUTION=24;

const VIEW_RADIUS=2;

const PLAYER_HEIGHT=1.75;

const WALK_SPEED=6;

const SPRINT_SPEED=10;

const JUMP_POWER=8;

const GRAVITY=22;

let playerX=0;

let playerY=10;

let playerZ=0;

let velocityY=0;

let grounded=false;

let yaw=0;

let pitch=0;

let running=false;

let timeOfDay=8;

const chunks=new Map();

const keys={
    w:false,
    a:false,
    s:false,
    d:false,
    shift:false
};

const joystick={
    active:false,
    id:null,
    x:0,
    y:0
};

function hash(x,z){
    let n=
        Math.sin(
            x*127.1+
            z*311.7+
            SEED*.017
        )*43758.5453123;

    return n-Math.floor(n);
}

function smooth(t){
    return t*t*(3-2*t);
}

function noise(x,z,scale){
    const px=x/scale;
    const pz=z/scale;

    const x0=Math.floor(px);
    const z0=Math.floor(pz);

    const x1=x0+1;
    const z1=z0+1;

    const tx=smooth(px-x0);
    const tz=smooth(pz-z0);

    const a=hash(x0,z0);
    const b=hash(x1,z0);
    const c=hash(x0,z1);
    const d=hash(x1,z1);

    const ab=a+(b-a)*tx;
    const cd=c+(d-c)*tx;

    return ab+(cd-ab)*tz;
}

function fbm(x,z,scale,octaves){
    let result=0;
    let amplitude=.5;
    let frequency=1;
    let total=0;

    for(let i=0;i<octaves;i++){

        result+=
            noise(
                x,
                z,
                scale/frequency
            )*amplitude;

        total+=amplitude;

        amplitude*=.5;
        frequency*=2;
    }

    return result/total;
}

function terrainHeight(x,z){

    const large=
        fbm(
            x+200,
            z-400,
            180,
            4
        );

    const medium=
        fbm(
            x-700,
            z+500,
            65,
            4
        );

    const small=
        fbm(
            x+900,
            z+100,
            22,
            3
        );

    let height=0;

    height+=(large-.5)*8;

    height+=(medium-.5)*7;

    height+=(small-.5)*1.8;

    const mountainNoise=
        fbm(
            x-1400,
            z+1200,
            100,
            3
        );

    if(mountainNoise>.64){
        const m=
            (mountainNoise-.64)*45;

        height+=m;
    }

    return height;
}

function temperature(x,z){

    return fbm(
        x+4000,
        z-3000,
        90,
        3
    );
}

function moisture(x,z){

    return fbm(
        x-2000,
        z+5000,
        75,
        3
    );
}

function biome(x,z){

    const h=terrainHeight(x,z);

    const t=temperature(x,z);

    const m=moisture(x,z);

    if(h<-1.5){
        return "water";
    }

    if(h<0){
        return "beach";
    }

    if(h>15){
        return "mountain";
    }

    if(h>8.5){
        return "rock";
    }

    if(t>.74&&m<.35){
        return "desert";
    }

    if(m>.68){
        return "forest";
    }

    if(m>.52){
        return "grassland";
    }

    if(m<.30){
        return "dryland";
    }

    return "plains";
}

const colors={
    water:new THREE.Color(0x3279a8),
    beach:new THREE.Color(0xc9b477),
    plains:new THREE.Color(0x70944c),
    grassland:new THREE.Color(0x4f8a45),
    forest:new THREE.Color(0x3e713d),
    dryland:new THREE.Color(0x9b864b),
    desert:new THREE.Color(0xc59b5d),
    rock:new THREE.Color(0x777777),
    mountain:new THREE.Color(0x626262)
};

function createTerrain(cx,cz){

    const key=cx+","+cz;

    if(chunks.has(key)){
        return;
    }

    const resolution=CHUNK_RESOLUTION;

    const vertexCount=
        (resolution+1)*
        (resolution+1);

    const positions=
        new Float32Array(
            vertexCount*3
        );

    const colorArray=
        new Float32Array(
            vertexCount*3
        );

    let index=0;

    for(
        let z=0;
        z<=resolution;
        z++
    ){

        for(
            let x=0;
            x<=resolution;
            x++
        ){

            const px=
                cx*CHUNK_SIZE+
                (x/resolution)*CHUNK_SIZE;

            const pz=
                cz*CHUNK_SIZE+
                (z/resolution)*CHUNK_SIZE;

            const py=
                terrainHeight(
                    px,
                    pz
                );

            positions[index*3]=
                px;

            positions[index*3+1]=
                py;

            positions[index*3+2]=
                pz;

            const c=
                colors[
                    biome(
                        px,
                        pz
                    )
                ];

            colorArray[index*3]=c.r;
            colorArray[index*3+1]=c.g;
            colorArray[index*3+2]=c.b;

            index++;
        }
    }

    const indices=[];

    for(
        let z=0;
        z<resolution;
        z++
    ){

        for(
            let x=0;
            x<resolution;
            x++
        ){

            const a=
                z*(resolution+1)+x;

            const b=a+1;

            const c=
                a+(resolution+1);

            const d=c+1;

            indices.push(
                a,c,b,
                b,c,d
            );
        }
    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            colorArray,
            3
        )
    );

    geometry.setIndex(indices);

    geometry.computeVertexNormals();

    const material=
        new THREE.MeshLambertMaterial({
            vertexColors:true,
            flatShading:false
        });

    const mesh=
        new THREE.Mesh(
            geometry,
            material
        );

    scene.add(mesh);

    const vegetation=
        createVegetation(
            cx,
            cz
        );

    chunks.set(
        key,
        {
            terrain:mesh,
            vegetation:vegetation
        }
    );
}

function slopeAt(x,z){

    const e=.7;

    const a=
        terrainHeight(
            x-e,
            z
        );

    const b=
        terrainHeight(
            x+e,
            z
        );

    const c=
        terrainHeight(
            x,
            z-e
        );

    const d=
        terrainHeight(
            x,
            z+e
        );

    return Math.hypot(
        (b-a)/(e*2),
        (d-c)/(e*2)
    );
}

function normalAt(x,z){

    const e=.6;

    const left=
        terrainHeight(
            x-e,
            z
        );

    const right=
        terrainHeight(
            x+e,
            z
        );

    const down=
        terrainHeight(
            x,
            z-e
        );

    const up=
        terrainHeight(
            x,
            z+e
        );

    const normal=
        new THREE.Vector3(
            left-right,
            e*2,
            down-up
        );

    return normal.normalize();
}

function tree(){

    const group=
        new THREE.Group();

    const trunk=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .18,
                .27,
                2.6,
                6
            ),
            new THREE.MeshLambertMaterial({
                color:0x67432c
            })
        );

    trunk.position.y=1.3;

    group.add(trunk);

    const leaves=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                1.25,
                3.1,
                8
            ),
            new THREE.MeshLambertMaterial({
                color:0x2f6638
            })
        );

    leaves.position.y=3.25;

    group.add(leaves);

    return group;
}

function bush(){

    return new THREE.Mesh(
        new THREE.SphereGeometry(
            .65,
            7,
            5
        ),
        new THREE.MeshLambertMaterial({
            color:0x39723b
        })
    );
}

function rock(){

    const r=
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                .65,
                0
            ),
            new THREE.MeshLambertMaterial({
                color:0x707070
            })
        );

    r.scale.set(
        1.3,
        .65,
        .9
    );

    return r;
}

function grass(){

    const group=
        new THREE.Group();

    const material=
        new THREE.MeshLambertMaterial({
            color:0x46833c,
            side:THREE.DoubleSide
        });

    for(let i=0;i<4;i++){

        const blade=
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    .10,
                    .65
                ),
                material
            );

        blade.position.y=.325;

        blade.rotation.y=
            i*Math.PI/4;

        group.add(blade);
    }

    return group;
}

function flower(){

    const group=
        new THREE.Group();

    const stem=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .025,
                .025,
                .5,
                4
            ),
            new THREE.MeshLambertMaterial({
                color:0x39733b
            })
        );

    stem.position.y=.25;

    group.add(stem);

    const head=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .14,
                6,
                5
            ),
            new THREE.MeshLambertMaterial({
                color:0xe8a8ca
            })
        );

    head.position.y=.52;

    group.add(head);

    return group;
}

function place(object,x,z){

    const y=
        terrainHeight(
            x,
            z
        );

    object.position.set(
        x,
        y+.01,
        z
    );

    const normal=
        normalAt(
            x,
            z
        );

    object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0,1,0),
        normal
    );

    return object;
}

function createVegetation(cx,cz){

    const group=
        new THREE.Group();

    const count=90;

    for(
        let i=0;
        i<count;
        i++
    ){

        const rx=
            hash(
                cx*917+i*13,
                cz*431+i*7
            );

        const rz=
            hash(
                cx*731+i*17,
                cz*211+i*19
            );

        const x=
            cx*CHUNK_SIZE+
            rx*CHUNK_SIZE;

        const z=
            cz*CHUNK_SIZE+
            rz*CHUNK_SIZE;

        const h=
            terrainHeight(
                x,
                z
            );

        const b=
            biome(
                x,
                z
            );

        if(
            b==="water"||
            b==="beach"||
            b==="mountain"
        ){
            continue;
        }

        const s=
            slopeAt(
                x,
                z
            );

        if(s>.9){
            continue;
        }

        const r=
            hash(
                cx*1009+i,
                cz*2039+i
            );

        let object=null;

        if(b==="forest"){

            if(r<.38){
                object=tree();
            }
            else if(r<.58){
                object=bush();
            }
            else if(r<.9){
                object=grass();
            }
            else{
                object=flower();
            }
        }

        else if(b==="grassland"){

            if(r<.08){
                object=tree();
            }
            else if(r<.18){
                object=bush();
            }
            else if(r<.83){
                object=grass();
            }
            else{
                object=flower();
            }
        }

        else if(b==="plains"){

            if(r<.45){
                object=grass();
            }
            else if(r<.56){
                object=flower();
            }
            else if(r<.63){
                object=bush();
            }
        }

        else if(b==="dryland"){

            if(r<.2){
                object=bush();
            }
            else if(r<.32){
                object=rock();
            }
        }

        else if(b==="desert"){

            if(r<.18){
                object=rock();
            }
        }

        else if(b==="rock"){

            if(r<.65){
                object=rock();
            }
        }

        if(object){

            place(
                object,
                x,
                z
            );

            const scale=
                .75+
                hash(
                    i+900,
                    cx+cz
                )*.6;

            object.scale.multiplyScalar(
                scale
            );

            group.add(object);
        }
    }

    scene.add(group);

    return group;
}

function streamWorld(){

    const cx=
        Math.floor(
            playerX/CHUNK_SIZE
        );

    const cz=
        Math.floor(
            playerZ/CHUNK_SIZE
        );

    for(
        let x=cx-VIEW_RADIUS;
        x<=cx+VIEW_RADIUS;
        x++
    ){

        for(
            let z=cz-VIEW_RADIUS;
            z<=cz+VIEW_RADIUS;
            z++
        ){

            createTerrain(
                x,
                z
            );
        }
    }
}

function movement(){

    let x=0;
    let z=0;

    if(keys.a)x-=1;
    if(keys.d)x+=1;

    if(keys.w)z-=1;
    if(keys.s)z+=1;

    if(joystick.active){

        x+=joystick.x;
        z+=joystick.y;
    }

    const length=
        Math.hypot(
            x,
            z
        );

    if(length>1){

        x/=length;
        z/=length;
    }

    return {
        x:x,
        z:z
    };
}

function updatePlayer(dt){

    const input=
        movement();

    const speed=
        running||
        keys.shift
            ? SPRINT_SPEED
            : WALK_SPEED;

    const forwardX=
        -Math.sin(yaw);

    const forwardZ=
        -Math.cos(yaw);

    const rightX=
        Math.cos(yaw);

    const rightZ=
        -Math.sin(yaw);

    const moveX=
        forwardX*input.z+
        rightX*input.x;

    const moveZ=
        forwardZ*input.z+
        rightZ*input.x;

    playerX+=
        moveX*speed*dt;

    playerZ+=
        moveZ*speed*dt;

    const ground=
        terrainHeight(
            playerX,
            playerZ
        );

    const target=
        ground+PLAYER_HEIGHT;

    velocityY-=
        GRAVITY*dt;

    playerY+=
        velocityY*dt;

    if(playerY<=target){

        playerY=target;

        velocityY=0;

        grounded=true;
    }
    else{

        grounded=false;
    }

    camera.position.set(
        playerX,
        playerY,
        playerZ
    );

    camera.rotation.y=yaw;

    camera.rotation.x=pitch;
}

function jump(){

    if(!grounded){
        return;
    }

    velocityY=
        JUMP_POWER;

    grounded=false;
}

function updateDayNight(dt){

    timeOfDay+=dt*.7;

    if(timeOfDay>=24){
        timeOfDay-=24;
    }

    const angle=
        (timeOfDay/24)*
        Math.PI*2-
        Math.PI/2;

    const sunX=
        Math.cos(angle)*220;

    const sunY=
        Math.sin(angle)*220;

    sun.position.set(
        sunX,
        sunY,
        80
    );

    const daylight=
        Math.max(
            0,
            Math.sin(angle)
        );

    sun.intensity=
        .08+
        daylight*1.35;

    ambient.intensity=
        .28+
        daylight*.9;

    const skyR=
        .035+
        daylight*.32;

    const skyG=
        .08+
        daylight*.5;

    const skyB=
        .16+
        daylight*.68;

    scene.background.setRGB(
        skyR,
        skyG,
        skyB
    );

    scene.fog=
        new THREE.Fog(
            scene.background,
            180,
            550
        );
}

const sun=
    new THREE.DirectionalLight(
        0xffffff,
        1
    );

sun.position.set(
    100,
    200,
    100
);

scene.add(sun);

const ambient=
    new THREE.HemisphereLight(
        0xb8ddff,
        0x405030,
        1
    );

scene.add(ambient);

const skyGeometry=
    new THREE.SphereGeometry(
        600,
        24,
        16
    );

const skyMaterial=
    new THREE.MeshBasicMaterial({
        color:0x87ceeb,
        side:THREE.BackSide
    });

const sky=
    new THREE.Mesh(
        skyGeometry,
        skyMaterial
    );

scene.add(sky);

window.addEventListener(
    "keydown",
    function(e){

        const k=
            e.key.toLowerCase();

        if(k==="w")keys.w=true;
        if(k==="a")keys.a=true;
        if(k==="s")keys.s=true;
        if(k==="d")keys.d=true;
        if(k==="shift")keys.shift=true;

        if(e.code==="Space"){
            jump();
        }
    }
);

window.addEventListener(
    "keyup",
    function(e){

        const k=
            e.key.toLowerCase();

        if(k==="w")keys.w=false;
        if(k==="a")keys.a=false;
        if(k==="s")keys.s=false;
        if(k==="d")keys.d=false;
        if(k==="shift")keys.shift=false;
    }
);

const joystickElement=
    document.getElementById(
        "joystick"
    );

const stickElement=
    document.getElementById(
        "stick"
    );

function moveStick(x,y){

    const rect=
        joystickElement.getBoundingClientRect();

    const centerX=
        rect.left+
        rect.width/2;

    const centerY=
        rect.top+
        rect.height/2;

    let dx=x-centerX;
    let dy=y-centerY;

    const radius=42;

    const distance=
        Math.hypot(
            dx,
            dy
        );

    if(distance>radius){

        dx=
            dx/distance*
            radius;

        dy=
            dy/distance*
            radius;
    }

    joystick.x=
        dx/radius;

    joystick.y=
        dy/radius;

    stickElement.style.left=
        "calc(50% + "+dx+"px)";

    stickElement.style.top=
        "calc(50% + "+dy+"px)";
}

function resetStick(){

    joystick.active=false;
    joystick.id=null;
    joystick.x=0;
    joystick.y=0;

    stickElement.style.left="50%";
    stickElement.style.top="50%";
}

joystickElement.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        joystick.active=true;

        joystick.id=e.pointerId;

        joystickElement.setPointerCapture(
            e.pointerId
        );

        moveStick(
            e.clientX,
            e.clientY
        );
    }
);

joystickElement.addEventListener(
    "pointermove",
    function(e){

        if(
            !joystick.active||
            e.pointerId!==joystick.id
        ){
            return;
        }

        moveStick(
            e.clientX,
            e.clientY
        );
    }
);

joystickElement.addEventListener(
    "pointerup",
    resetStick
);

joystickElement.addEventListener(
    "pointercancel",
    resetStick
);

document.getElementById(
    "jump"
).addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        jump();
    }
);

const sprintButton=
    document.getElementById(
        "sprint"
    );

sprintButton.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        running=true;
    }
);

sprintButton.addEventListener(
    "pointerup",
    function(){
        running=false;
    }
);

sprintButton.addEventListener(
    "pointercancel",
    function(){
        running=false;
    }
);

let lookId=null;

let lastX=0;

let lastY=0;

canvas.addEventListener(
    "pointerdown",
    function(e){

        lookId=e.pointerId;

        lastX=e.clientX;

        lastY=e.clientY;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    function(e){

        if(e.pointerId!==lookId){
            return;
        }

        const dx=
            e.clientX-lastX;

        const dy=
            e.clientY-lastY;

        lastX=e.clientX;
        lastY=e.clientY;

        yaw-=dx*.004;

        pitch-=dy*.004;

        pitch=
            Math.max(
                -1.5,
                Math.min(
                    1.5,
                    pitch
                )
            );
    }
);

canvas.addEventListener(
    "pointerup",
    function(e){

        if(e.pointerId===lookId){
            lookId=null;
        }
    }
);

window.addEventListener(
    "resize",
    function(){

        camera.aspect=
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

playerY=
    terrainHeight(
        0,
        0
    )+
    PLAYER_HEIGHT;

streamWorld();

function animate(){

    requestAnimationFrame(
        animate
    );

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );

    updatePlayer(dt);

    streamWorld();

    updateDayNight(dt);

    sky.position.set(
        playerX,
        playerY,
        playerZ
    );

    renderer.render(
        scene,
        camera
    );
}

animate();
</script>

</body>
</html>
